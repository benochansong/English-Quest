/* Motion is confined to the illustrated stage; the command area stays still. */
.title { isolation: isolate; background: #142e32; }
.title::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background: radial-gradient(ellipse 40% 59% at 50% 52%, #091b21ce 0%, #09192383 59%, transparent 100%),
              linear-gradient(0deg, #061519aa, transparent 32%, transparent 88%, #0b141b66);
}
.title .title-art { opacity: 1; }
.title .title-content { z-index: 1; }
.title h1 { text-shadow: 0 3px 0 #413d33, 0 6px 20px #06161e, 0 0 55px #e5d39f25; }
.combatant { transform-origin: center bottom; }
.combatant svg { width: 100%; height: 100%; }
.hero-art, .slime-art { display: block; }
.portrait .rowan-art { width: 100%; display: block; }
.arena .enemy { height: 58%; }
.arena .enemy.boss { height: 73%; }
.forest-mist { animation: drift-mist 20s ease-in-out infinite alternate; }
.firefly { animation: lantern 4.8s var(--delay, 0s) ease-in-out infinite alternate; }
.dialogue p { animation: reveal-dialogue .42s ease-out both; }
.reward { animation: reward-rise .55s ease-out both; }
/* All movement is decorative. The engine supplies the action and impact state. */
.arena { container-type: inline-size; isolation: isolate; }
.arena .combatant { pointer-events: none; }
.arena .hero { z-index: 1; animation: none; }
.arena-status,.arena .float { z-index: 4; }
.arena .fx { z-index: 2; position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.hero-torso { transform-origin: 94px 151px; animation: breathe-armor 3.8s ease-in-out infinite; }
.hero-head { transform-origin: 103px 77px; }
.hero-cape { transform-origin: 80px 93px; animation: cloth-drift 3.1s ease-in-out infinite alternate; }
.sword-arm { transform-origin: 122px 99px; animation: sword-ready 3.8s ease-in-out infinite; }
.spell-arm { transform-origin: 64px 108px; }
.weapon { transform-origin: 165px 117px; }
.arena .enemy { animation: none; }
.gel-body { transform-origin: 106px 177px; animation: jelly-breathe 2.35s ease-in-out infinite; }
.jelly-eyes { transform-origin: 81px 107px; animation: blink 5.7s linear infinite; }

.arena[data-fx="sword"] .fx::after {
  content: ''; position: absolute; top: 41%; right: 16%; width: 29%; height: 29%;
  border-bottom: 5px solid #fff0bb; border-radius: 50%; filter: drop-shadow(0 0 6px #efb76f);

  border-radius: 90% 45% 45% 90%; background: radial-gradient(ellipse at 76% 48%, #ffffd7 4%, #ffc16b 29%, #dc6c48 56%, transparent 73%);
  filter: drop-shadow(0 0 7px #ee9e53); animation: fire-flight .59s linear both;

  content: ''; position: absolute; top: 46%; right: 16%; width: 14%; aspect-ratio: 1;

  content: ''; position: absolute; left: 14%; bottom: 8%; width: min(16%,155px); height: 48%;
  border-radius: 28% 55% 52% 37% / 18% 29% 67% 72%;
  border: 2px solid #baf6fb; box-shadow: inset 0 0 18px #79daff77, 0 0 9px #79daff77;
  background: linear-gradient(145deg,#acf2ff4d,#69bee41c); animation: ward .6s ease-out both;
}
.arena[data-guarded="true"]:is([data-fx="enemy"],[data-fx="heavy"]) .fx::before { animation: shield-contact .76s ease-out both; }
.arena[data-fx="heavy"] .fx::after {
  content: ''; position: absolute; bottom: 4%; left: 6%; width: 81%; height: 21%; border-radius: 50%;
  border: 3px solid #ddc3fd; box-shadow: inset 0 0 16px #c99eea77,0 0 10px #e4c4ff88;
  transform-origin: 88% center; animation: impact-ring .37s .37s ease-out both;
}
.arena[data-fx="heal"] .fx::before,.arena[data-fx="win"] .fx::before {
  content: ''; position: absolute; bottom: 13%; left: 19%; width: 8px; height: 8px;
  color: #b9ffb5; background: currentColor;
  box-shadow: 17px -37px 0 -1px currentColor,-38px -19px 0 -2px currentColor,45px -12px 0 -2px currentColor,-16px -66px 0 -1px currentColor,31px -93px 0 -2px currentColor,58px -58px 0 -1px currentColor;
  animation: runes-rise .82s ease-out both;
}
.arena[data-fx="win"] .fx::before { color: #f5d48b; }
.spring-ripples { animation: water-drift 7.6s ease-in-out infinite alternate; }
.water-threads { animation: falling-water 1.4s ease-in-out infinite alternate; }
@keyframes king-arrives { from { transform: translateY(-25%) scale(.82); opacity: .08; } 70% { transform: scale(1.12,.87); } }

@keyframes float-jelly { 50% { transform: translateY(-8px) scale(.986,1.016); } }
@keyframes blink { 0%,41%,44%,100% { transform: scaleY(1); } 42.8% { transform: scaleY(.12); } }
@keyframes ember-heart { 50% { transform: scale(1.08); opacity: .8; } }
@keyframes charged-heart { to { transform: scale(1.35); filter: brightness(1.3); } }

@keyframes levitate-shard { to { transform: translateY(-7px) rotate(15deg); } }

@keyframes king-slam { 20% { transform: scale(1.1,.83); } 42% { transform: translate(-3%,-15%) scale(.97,1.05); } 51% { transform: translate(-4%,0) scale(1.17,.8); } 75% { transform: scale(.98,1.03); } }
@keyframes hero-hit { 30% { transform: translateX(-6%) rotate(-5deg); filter: brightness(1.5); } }
@keyframes shatter { 35% { filter: brightness(1.6); transform: scale(1.08,.92); } to { opacity: 0; transform: scale(.8,.6); } }
@keyframes salute { 30% { transform: rotate(5deg); } 72%,100% { transform: rotate(-44deg); } }
@keyframes wounded { to { transform: translateY(9%) rotate(-12deg); filter: saturate(.5); } }
@keyframes falter { 42% { transform: rotate(-5deg); } }
@keyframes slash-trail { 0% { opacity: 0; transform: rotate(-50deg) scale(.55); } 32% { opacity: 1; } 100% { opacity: 0; transform: rotate(-9deg) scale(1); } }

@media (max-width: 700px) {
  /* The viewBox crops toward its centre on tall screens. Keep all four landmarks in the frame. */

  .title-art .painted-keep { transform: translate(-215px, 3px); }
  .title-art .painted-traveler { transform: translate(353px, 90px); }
  .title-art .painted-left { transform: translateX(436px); }
  .title-art .painted-right { transform: translateX(-432px); }

}
@media (prefers-reduced-motion: reduce) {
  .forest-mist,.firefly,.dialogue p,.reward,.arena .combatant,.arena .fx::after,.arena .fx::before {
    animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important;
  }
}

/* The atlas, the notebook and the battle HUD use the same brass rules and forest inks. */
:root {
  --brass: #d4af69;
  --paper: #f3e9cf;
  --ink: #263832;
  --forest-glass: #142d2d;
  --serif: 'Palatino Linotype','Batang',Georgia,serif;
}
.world { background: radial-gradient(ellipse at 13% 4%,#34534a55,transparent 44%),linear-gradient(150deg,#132e30,#0c2025 62%,#102b2a); }
.shell { max-width: 1320px; }
.shell .screen-heading h2,.notebook-heading h2 { font-family: var(--serif);letter-spacing:-.055em;color:#fff2d2; }
.btn:not(:disabled):focus-visible { outline:3px solid #fbe19d;outline-offset:3px;z-index:2; }
.btn { border-radius:5px; }
.title-foot { font-family:var(--serif); }
.title-chapter { display:flex;align-items:center;justify-content:center;gap:12px;color:#f6dfa7;font-size:.78rem;letter-spacing:.16em; }
.title-chapter::before,.title-chapter::after {content:'';width:24px;height:1px;background:var(--brass);}
.title .title-content h1 {line-height:.88;letter-spacing:-.065em;}
.title .title-content h1 span {display:block;}
.title .title-content h1 span:last-child {font-style:italic;color:#f1d8a0;}
.title .title-settings {font-size:.9rem;}
@media(min-width:800px) {
  .title-art .painted-traveler {transform:translate(425px,12px);}
  .title {justify-content:flex-start;padding-inline:max(8%,calc((100vw - 1200px)/2));}
  .title .title-content {width:fit-content;min-width:350px;text-align:left;}
  .title-chapter {justify-content:flex-start;}
  .title-chapter::before {display:none;}
  .title .title-content h1 {font-size:clamp(5.5rem,7.5vw,8rem);margin:24px 0 19px;}
  .title .subtitle {letter-spacing:.035em;}
  .title .title-copy {margin:12px 0 24px;}
  .title-buttons {width:254px;margin:0;gap:8px;}
  .title::after {background:linear-gradient(90deg,#0b1b25d9 0%,#0c2029aa 29%,#0a1f293b 54%,transparent 80%);}
}
.topbar {padding-bottom:12px;}
.map-grid {grid-template-columns:minmax(0,1.25fr) minmax(290px,.85fr);align-items:start;gap:clamp(16px,3vw,34px);}
.atlas {overflow:hidden;background:#1c3c38;border:1px solid #b5a06e8c;box-shadow:0 14px 35px #07171977;}
.atlas-heading,.atlas-caption {padding:14px clamp(14px,2vw,22px);background:#183333;}
.atlas-heading {display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ccb37b77;}
.atlas-heading>span:last-child {color:#ead398;font-size:.87rem;}
.atlas-plate {position:relative;aspect-ratio:600 / 390;background:#244940;overflow:visible;}
.atlas-plate>svg {position:absolute;inset:0;width:100%;height:100%;display:block;}
.btn.atlas-pin {position:absolute;width:44px;height:44px;padding:0;min-height:44px;display:grid;place-items:center;transform:translate(-50%,-50%);border:0;background:none;}
.btn.atlas-pin:hover {transform:translate(-50%,-50%);}
.atlas-pin .ui-icon {background:#182e30;border:2px solid #c9ab65;color:#f7db9c;width:32px;height:32px;padding:6px;border-radius:50%;box-shadow:0 2px 7px #08161eca;}
.atlas-pin.locked .ui-icon {background:#32423e;color:#d7cbae;border-color:#9c9d83;}
.atlas-pin.cleared .ui-icon {background:#275d48;color:#d6f1b8;}
.atlas-pin.selected .ui-icon {outline:2px solid #fff0bb;outline-offset:3px;}
.atlas-pin.current:before {content:'';position:absolute;inset:3px;border:1px solid #edd492;border-radius:50%;animation:atlas-pulse 3s ease-out infinite;}
@keyframes atlas-pulse {from{opacity:.9;transform:scale(.8)}to{opacity:0;transform:scale(1.6)}}
.pin-1 {left:22.833%;top:70%;}.pin-2 {left:55%;top:49.23%;}.pin-3 {left:80.333%;top:25.641%;}
.atlas-caption {border-top:1px solid #ccb37b77;}
.atlas-caption small,.atlas-caption strong,.metric small,.metric strong,.trend small,.achievement small {display:block;}
.atlas-caption small {font:italic .9rem Georgia,serif;color:#dfc68f;}
.atlas-caption strong {font:700 1.2rem var(--serif);margin:4px 0;}
.atlas-caption p,.journal-intro {font-size:.93rem;color:#cfddd2;line-height:1.6;margin:8px 0 0;}
.route-column h3,.ledger-heading {margin:2px 0 14px;font:700 1.3rem var(--serif);}
.stage.current {background:linear-gradient(115deg,#335346,#243a31);border-left:3px solid #e5c884;}
.stage.cleared .stage-number {color:#a8c9aa;}
.stage-number {font-variant-numeric:lining-nums;}
.journal-links .btn {display:inline-flex;gap:6px;align-items:center;}
.notebook {max-width:980px;margin:clamp(8px,3.5vh,48px) auto;padding:clamp(16px,3vw,38px);background:linear-gradient(130deg,#294642,#183532 65%,#102a29);border:1px solid #beaa77;border-radius:7px 19px 19px 7px;box-shadow:inset 6px 0 #122d2d,inset 9px 0 #486259,0 14px 40px #05141788;}
.notebook-heading {padding:0 8px;margin-bottom:20px;}
.notebook-heading h2 {font-size:clamp(1.9rem,3.5vw,3rem);margin:6px 0;}
.notebook-heading p {color:#cadbcf;margin:6px 0;}
.paper-spread {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;position:relative;border:1px solid #a89265;box-shadow:0 3px 0 #bdb195,0 5px 0 #6c6651,0 10px 15px #0b211e77;}
.rune-card {position:relative;display:flex;flex-direction:column;color:var(--ink);padding:clamp(16px,2.7vw,34px);min-height:285px;background:radial-gradient(ellipse at 26% 15%,#fff8e8,transparent 73%),linear-gradient(to right,#e7dabe,#f5ebd3 94%,#dcccae);}
.rune-card:nth-child(2) {background:linear-gradient(to right,#dac8a8,#f5ebd3 9%,#f7edd6 89%,#ebdec3);}
.rune-header {display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:#465d4f;padding-bottom:12px;border-bottom:1px solid #8b967970;}
.rune-header .ui-icon {width:22px;height:22px;}
.rune-card h3 {font:500 clamp(1.8rem,3vw,2.8rem)/1.12 Georgia,serif;margin:18px 0 6px;color:#263b32;}
.rune-card .translation {font-size:1.1rem;font-weight:700;margin:5px 0;}
.recall-hint,.card-note {font-size:.9rem;line-height:1.65;color:#4b5b4f;margin:5px 0 13px;}
.rune-card blockquote {border-left:2px solid #a5aa82;margin:16px 0 18px;padding:4px 0 4px 12px;font:italic 1.15rem Georgia,serif;color:#304137;}
.rune-card blockquote small {display:block;color:#4c5b50;font:normal .88rem system-ui;margin-top:5px;}
.rune-card.revealed .card-face {animation:turn-leaf .22s ease-out;}
@keyframes turn-leaf {from {opacity:.35;transform:translateY(3px);}}
.card-actions {display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:auto;}
.card-actions .btn {min-height:42px;padding:6px 10px;font-size:.88rem;}
.card-actions .flip {background:#294b3e;border-color:#294b3e;color:#fff6df;}
.card-actions .flag,.card-actions .speak {border:1px solid #94a28e;background:transparent;color:#354d3c;}
.card-actions .marked {background:#d7e2cd;border-color:#537145;}
.card-actions .btn:focus-visible {outline-color:#405c49;}
.notebook-footer {display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:22px;flex-wrap:wrap;}
.notebook-footer .page-count {margin-left:9px;}
.battle-heading {align-items:baseline;}
.battle-heading h2 {font-size:clamp(1.3rem,2.2vw,1.95rem);}
.battle .arena {border-radius:8px 8px 0 0;height:clamp(270px,44vh,450px);border-bottom:none;}
.arena-status {top:13px;}
.stat {background:linear-gradient(95deg,#0b2227e6,#17323385);padding:9px 13px;border-top:1px solid #c3ae7c8a;border-radius:2px;}
.stat.right {background:linear-gradient(-95deg,#0b2227e6,#17323385);}
.stat b {font:600 .77rem system-ui;letter-spacing:.04em;}
.battle-ribbon {display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;padding:7px 16px;border:1px solid #93815c;border-radius:0 0 8px 8px;background:linear-gradient(90deg,#243e36,#172e32);font-size:.87rem;}
.combo,.combo small {color:#cfdbc9;}
.combo b {margin:0 3px;color:#f3ddb1;}
.combo.active,.combo.active b,.streak-line {color:#f3d48a;}
.battle-intent {font-size:.8rem;text-align:right;color:#f0debb;}
.battle-panel {border-radius:8px;background:linear-gradient(125deg,#263d36,#162d2c 70%);min-height:180px;}
.battle-panel h2 {font-weight:680;}
.battle-panel p {line-height:1.7;}
.abilities .ability {background:linear-gradient(145deg,#334a3d,#1a302f);border-top:2px solid #c3ad7f;}
.abilities .ability:nth-child(2) {border-top-color:#ca8a68;}
.abilities .ability:nth-child(3) {border-top-color:#91bcc7;}
.abilities .ability:nth-child(4) {border-top-color:#a0bd89;}
.reward-tally {display:flex;justify-content:center;gap:28px;padding:18px 0;border-block:1px solid #c8b37760;color:var(--gold);font:1.5rem var(--serif);}
.earned-names {color:#efcf86;}
.practice-row,.achievement,.trend {display:flex;align-items:center;justify-content:space-between;gap:16px;}
.practice-row {padding:14px 0;border-bottom:1px solid #9ea18a33;}
.practice-row:last-child {border-bottom:0;}
.practice-row strong,.practice-row small {display:block;margin:5px 0;}
.practice-row small,.metric small,.trend small,.achievement small {color:#bbcdc0;}
.practice-row .btn {flex:none;}
.review-group h3 small,.ledger-heading small {color:#dcbf8a;font-size:.83em;margin-left:.35em;}
.empty-journal {padding:25px;display:flex;align-items:center;gap:16px;}
.metric-grid {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
.metric {padding:19px;}

.trend {padding:16px 20px;margin-top:12px;}
.trend small,.achievement small {margin-top:5px;}
.trend>strong {color:#f1d99c;}
.ledger-heading {margin-top:26px;}
.achievement-list {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}

@media(max-width:800px){

}

 .atlas-pin.current:before,.rune-card.revealed .card-face{animation:none;}

/* The village panorama is fully local SVG. Map pins belong to the HTML controls. */
.village-panorama,.village-portrait,.village-item-icon,.village-foe-art { display: block; width: 100%; height: 100%; }
.v-lantern { animation: soft-lantern 3.8s ease-in-out infinite alternate; }
.v-hearth { transform-origin: 415px 325px; animation: hearth-light 3.6s ease-in-out infinite alternate; }
.v-water { animation: canal-drift 7s ease-in-out infinite alternate; }
.v-pennants,.v-awning { transform-box: fill-box; transform-origin: center top; animation: village-breeze 3.8s ease-in-out infinite alternate; }
.v-gate-mist { animation: canal-drift 11s ease-in-out infinite alternate; }
.mill-sails { transform-origin: 0 0; animation: windmill-turn 47s linear infinite; }
.village-portrait { max-width: 100%; }
.arena[data-stage="4"] .enemy,.arena[data-stage="5"] .enemy { height: 65%; }
.arena[data-stage="6"] .enemy { height: 79%; }
.crow-flight { transform-origin: 114px 118px; animation: crow-hover 3.5s ease-in-out infinite; }
.crow-front-wing { transform-origin: 102px 116px; animation: wingbeat 1.62s ease-in-out infinite alternate; }
.crow-rear-wing { transform-origin: 117px 117px; animation: far-wingbeat 1.62s ease-in-out infinite alternate; }
.v-feather-mote,.v-wisp-note,.golem-rune { animation: word-float 2.6s var(--lag,0s) ease-in-out infinite alternate; }
.wisp-flight { animation: wisp-float 4.3s ease-in-out infinite alternate; }
.wisp-orbit { animation: tide-pulse 2.3s ease-in-out infinite alternate; }
.stone-trunk { transform-origin: 108px 155px; animation: stone-breath 4.8s ease-in-out infinite; }
.stone-shoulder { transform-origin: 150px 81px; animation: stone-ready 4.8s ease-in-out infinite; }
.golem-core { transform-origin: 109px 106px; animation: rune-glow 2.9s ease-in-out infinite alternate; }
.arena[data-stage="4"][data-fx="enemy"] .enemy { animation: crow-dive .78s ease-in-out both; }
.arena[data-stage="4"][data-fx="enemy"] .crow-front-wing { animation: folded-wing .78s ease-in-out both; }
.arena[data-stage="5"][data-fx="enemy"] .enemy { animation: echo-cast .78s ease-out both; }
.arena[data-stage="5"][data-fx="enemy"] .fx::after {
  content: ''; position: absolute; top: 40%; right: 17%; width: 9%; height: 24%;
  border: 2px solid #d3fff0; border-top-color: transparent; border-bottom-color: transparent;
  border-radius: 50%; box-shadow: -4px 0 8px #a6efe37b; animation: echo-wave .4s .03s ease-in both;
}
.arena[data-stage="6"][data-fx="enemy"] .enemy { animation: stone-stride .8s ease-in-out both; }
.arena[data-stage="6"]:is([data-fx="enemy"],[data-fx="heavy"]) .stone-shoulder { animation: quarry-strike .79s ease-in-out both; }
.arena[data-stage="6"]:is([data-intent="charge"],[data-intent="broken"],[data-fx="charge"]) .golem-core { animation: activated-rune .8s ease-in-out infinite alternate; }
.arena[data-stage="6"]:is([data-intent="charge"],[data-intent="broken"],[data-fx="charge"]) .golem-rune { filter: drop-shadow(0 0 5px #f5d788); }
.arena[data-stage="6"][data-fx="interrupt"] .golem-core { animation: quiet-core .8s ease-out both; }
.arena[data-stage="6"][data-fx="interrupt"] .floating-runes { animation: interrupted-runes .72s ease-out both; }
.arena[data-stage="6"][data-fx="interrupt"] .stone-trunk { animation: broken-stance .8s ease-out both; }
.arena:is([data-stage="4"],[data-stage="5"],[data-stage="6"])[data-fx="sword"] .village-foe-art { animation: village-hit .4s .36s ease-out both; }
.arena:is([data-stage="4"],[data-stage="5"],[data-stage="6"])[data-fx="fire"] .village-foe-art { animation: village-hit .33s .58s ease-out both; }

/* These rings show a state and a spell. They never represent microphone amplitude. */
.voice-medallion { position: relative; isolation: isolate; }
.voice-medallion::after {
  content: ''; position: absolute; pointer-events: none; inset: 3%;
  border: 1px solid #d2bc7f66; border-radius: 48% 48% 43% 43%;
}
.voice-speaker:has(.voice-script) .voice-medallion > svg { transform-origin: 50% 85%; }
.voice-trial:has(.voice-response) .voice-medallion > svg { animation: mentor-nod .52s ease-out; }
/* A warm reply uses the portrait's existing linework, with softened brows and a smile. */
.voice-trial:has(.voice-response) .expression-clara > path {
  d: path('M57 63q5 -4 12 -2 M86 57q7 -5 15 -1 M61 70q3 -3 6 -1 M89 65q3 -3 6 -1 M77 66l-2 10 5 2 M71 83q10 12 20 -3');
}
.voice-trial:has(.voice-response) .expression-thomas > path {
  d: path('M54 59q7 -6 17 -3 M88 55q7 -5 16 -1 M58 68q6 -5 11 -2 M90 64q5 -4 10 -1 M79 61l-3 11 7 2 M70 94q12 14 24 -4');
}
.voice-trial:has(.voice-response) .expression-elena > path {
  d: path('M59 63q6 -4 12 -1 M88 59q6 -3 12 1 M63 70l6 -1 M90 67l7 -1 M80 66l-2 10 5 1 M73 84q8 8 16 -3');
}
.voice-trial:has(.voice-response) .expression-rowan > path {
  d: path('M55 54q5 -5 13 -1 M80 53q8 -6 14 -1 M58 61q4 -4 7 0 M81 61q5 -4 9 -1 M74 60l-3 10 5 1 M65 82q10 11 19 -1 M49 87q4 14 13 20 M86 92l-10 20');
}
.mic-panel[data-mic-state="listening"] .mic-state i {
  box-shadow: 0 0 0 3px #77c4ac36; animation: state-ring 2.2s ease-out infinite;
}
.mic-panel[data-mic-state="processing"] .mic-state i { box-shadow: 0 0 0 2px #d2b67555; }
.listen-sigil { position: relative; isolation: isolate; }
.listen-sigil::before,.listen-sigil::after {
  content: ''; position: absolute; left: 50%; top: 50%; width: 1.6em; height: 1.6em;
  border: 1px solid #b8cfb977; border-radius: 50%; transform: translate(-50%,-50%); pointer-events: none;
}
.listen-sigil::after { width: 2.05em; height: 2.05em; border-color: #d8c18355; }
.arena:is([data-fx="voice"],[data-fx="burst"]) .hero-torso { animation: invocation .84s ease-out both; }
.arena:is([data-fx="voice"],[data-fx="burst"]) .spell-arm { animation: cast-arm .82s ease-in-out both; }
.arena:is([data-fx="voice"],[data-fx="burst"]) .sword-arm { animation: lower-blade .82s ease-in-out both; }
.arena[data-fx="voice"] .fx::before {
  content: '·   A   ·   E   ·'; position: absolute; left: 22%; bottom: 34%;
  color: #e2fbe6; font: italic 700 clamp(.82rem,1.6vw,1.35rem) Georgia,serif; letter-spacing: .25em;
  text-shadow: 0 0 8px #8eecdd,0 0 15px #689d9d;
  animation: spoken-runes .66s ease-in-out both;
}
.arena[data-fx="voice"] .fx::after {
  content: ''; position: absolute; top: 46%; left: 25%; width: 9%; height: 23%;
  border: 3px double #c6f7df; border-left-color: transparent; border-radius: 50%;
  filter: drop-shadow(0 0 7px #92d9d0); animation: voice-surge .58s ease-in both;
}
.arena[data-fx="echo"] .hero-torso { animation: none; transform: rotate(-7deg) translateY(3px); }
.arena[data-fx="echo"] .spell-arm { transform: rotate(-51deg); }
.arena[data-fx="echo"] .fx::before,.arena[data-fx="echo"] .fx::after {
  content: ''; position: absolute; bottom: 9%; left: 12%; width: 20%; height: 49%;
  border: 2px solid #a5dbd4; border-radius: 55% 55% 46% 46% / 65% 65% 39% 39%;
  box-shadow: inset 0 0 13px #a3cfda55,0 0 7px #96d5cc70; animation: echo-vault .64s ease-out both;
}
.arena[data-fx="echo"] .fx::after { left: 13%; width: 18%; height: 46%; border: 1px dashed #f2d89b; animation-delay: .07s; }
.arena[data-fx="burst"] .fx::before {
  content: ''; position: absolute; width: 42%; height: 3px; top: 58%; left: 29%;
  transform-origin: left center; background: linear-gradient(90deg,transparent,#e4c4ea 36%,#f1dd97);
  box-shadow: 0 0 9px #d9b7f1; animation: dialogue-thread .57s ease-out both;
}
.arena[data-fx="burst"] .fx::after {
  content: ''; position: absolute; top: 40%; right: 12%; width: 23%; aspect-ratio: 1.3;
  border: 4px dotted #f0d39c; border-radius: 50%; box-shadow: inset 0 0 14px #bd9de7,0 0 14px #c8a4e2;
  animation: dialogue-flower .4s .46s ease-out both;
}
.arena[data-fx="voice"] :is(.gel-body,.village-foe-art),.arena[data-fx="burst"] :is(.gel-body,.village-foe-art) {
  animation: village-hit .34s .48s ease-out both;
}
@keyframes mentor-nod { 42% { transform: rotate(-2deg) translateY(1px); } }
@keyframes state-ring { from { box-shadow: 0 0 0 2px #77c4ac5a; } to { box-shadow: 0 0 0 6px #77c4ac00; } }
@keyframes spoken-runes { from { opacity: 0; transform: translate(-5px,11px); } 34% { opacity: 1; } to { opacity: 0; transform: translate(10px,-16px); } }
@keyframes voice-surge { 0% { opacity: 0; transform: scale(.35); } 34% { opacity: .9; } 86% { opacity: 1; } to { left: 71%; opacity: 0; transform: scale(1.3); } }
@keyframes echo-vault { from { opacity: 0; transform: scale(.66); } 62% { opacity: 1; } to { opacity: .85; } }
@keyframes dialogue-thread { 0%,18% { opacity: 0; transform: scaleX(0); } 75% { opacity: .95; } to { transform: scaleX(1); opacity: 0; } }
@keyframes dialogue-flower { from { transform: scale(.22) rotate(-12deg); opacity: 0; } 30% { opacity: .95; } to { transform: scale(1.18) rotate(18deg); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .mic-panel .mic-state i,.voice-medallion > svg,.arena:is([data-fx="voice"],[data-fx="echo"],[data-fx="burst"]) :is(.hero-torso,.sword-arm,.spell-arm,.slime-art,.village-foe-art),
  .arena:is([data-fx="voice"],[data-fx="echo"],[data-fx="burst"]) .fx::before,
  .arena:is([data-fx="voice"],[data-fx="echo"],[data-fx="burst"]) .fx::after { animation: none !important; }
}

/* Each class uses the shared combat skeleton and a separate set of illustrated costume pieces. */
.rpg-hero,.gear-art,.trial-room-art,.trial-guardian-art { display:block; width:100%; height:100%; }
.rpg-vanguard { --class-light:#b7dbed; }
.rpg-arcanist { --class-light:#d5c1ef; }
.rpg-pathfinder { --class-light:#c8dba4; }
.rpg-hero .class-orbit { animation: class-light 4.4s ease-in-out infinite alternate; }
.rpg-arcanist .staff-crystal { transform-origin:1px -83px; animation: staff-light 3.2s ease-in-out infinite alternate; }
.arena[data-fx="fire"] .rpg-arcanist .sword-arm { animation: star-staff .86s ease-out both; }
.arena[data-fx="fire"] .rpg-arcanist .staff-crystal { filter:drop-shadow(0 0 4px #cfb9ff); }
.arena[data-fx="guard"] .rpg-vanguard .spell-arm { transform:rotate(-27deg) translate(5px,-2px); }
.arena[data-fx="heal"] .rpg-pathfinder .class-orbit { filter:brightness(1.35); }
.trial-float,.trial-mote { animation: trial-hover 4.8s var(--lag,0s) ease-in-out infinite alternate; }
.trial-mote { animation-duration:3.9s; }
.echo-bell { transform-origin:0 -29px; animation: suspended-chime 5.4s ease-in-out infinite alternate; }
.echo-haze { animation: mist-layer 9s ease-in-out infinite alternate; }
.echo-resonance { animation: echo-harmonic 4.9s ease-in-out infinite alternate; }
.stag-spine { transform-origin:117px 159px; animation: stag-breathe 3.9s ease-in-out infinite alternate; }
.stag-head { transform-origin:85px 103px; animation: stag-watch 4.2s ease-in-out infinite alternate; }
.owl-hover,.ray-drift { animation: trial-hover 4.3s ease-in-out infinite alternate; }
.folio-wing { transform-origin:0 5px; animation: parchment-wing 2.7s ease-in-out infinite alternate; }
.owl-head { transform-origin:116px 115px; animation: owl-watch 5.3s ease-in-out infinite alternate; }
.echo-fin { transform-origin:0 3px; animation: ray-fin 3.8s ease-in-out infinite alternate; }
.trial-arena[data-fx="hit"] .trial-guardian-art { animation: guardian-hit .44s ease-out both; }
.trial-arena[data-fx="win"] .trial-guardian-art { animation: guardian-release .8s ease-out both; }
.rpg-loot-reveal { animation: reward-seal .67s cubic-bezier(.18,.77,.21,1) both; }

@keyframes star-staff { 24% { transform:rotate(-28deg); } 43% { transform:rotate(-37deg); } 66% { transform:rotate(13deg); } }
@keyframes trial-hover { from { transform:translateY(1px); } to { transform:translateY(-5px); } }
@keyframes suspended-chime { from { transform:rotate(-2deg); } to { transform:rotate(2deg); } }
@keyframes mist-layer { to { transform:translateX(11px); opacity:.09; } }
@keyframes echo-harmonic { to { opacity:.57; } }
@keyframes stag-breathe { to { transform:translateY(-.8px) rotate(-.8deg); } }
@keyframes stag-watch { to { transform:rotate(3deg); } }
@keyframes parchment-wing { from { transform:rotate(-2deg); } to { transform:rotate(6deg) scaleY(.96); } }
@keyframes owl-watch { to { transform:rotate(-4deg); } }
@keyframes ray-fin { from { transform:rotate(-7deg) scaleY(.97); } to { transform:rotate(4deg); } }

  }
}

/* The renderer translates actor wrappers; these animations touch only their local joints. */
.eq-actor-art { pointer-events:none; }
.eq-portrait { display:block; width:100%; height:100%; }
.eq-actor-art .eq-leg-left { transform-origin:-5px -12px; }
.eq-actor-art .eq-leg-right { transform-origin:5px -12px; }
.eq-actor-art .eq-arm-left { transform-origin:-8px -28px; }
.eq-actor-art .eq-arm-right { transform-origin:8px -28px; }
.eq-actor-art .eq-cape { transform-origin:0 -31px; }
.eq-actor-art .eq-head { transform-origin:0 -32px; }
.eq-idle .eq-actor-art .eq-body,.eq-actor-art.eq-idle .eq-body { animation:eq-breathe 3.5s ease-in-out infinite alternate; }
.eq-idle .eq-actor-art .eq-cape,.eq-actor-art.eq-idle .eq-cape { animation:eq-cloak-idle 4s ease-in-out infinite alternate; }
.eq-walking .eq-actor-art .eq-leg-left,.eq-actor-art.eq-walking .eq-leg-left { animation:eq-stride .44s linear infinite; }
.eq-walking .eq-actor-art .eq-leg-right,.eq-actor-art.eq-walking .eq-leg-right { animation:eq-stride .44s -.22s linear infinite; }
.eq-walking .eq-actor-art .eq-arm-left,.eq-actor-art.eq-walking .eq-arm-left { animation:eq-arm-swing .44s -.22s linear infinite; }
.eq-walking .eq-actor-art .eq-arm-right,.eq-actor-art.eq-walking .eq-arm-right { animation:eq-arm-swing .44s linear infinite; }
.eq-walking .eq-actor-art .eq-body,.eq-actor-art.eq-walking .eq-body { animation:eq-walk-bob .22s ease-in-out infinite alternate; }
.eq-walking .eq-actor-art .eq-cape,.eq-actor-art.eq-walking .eq-cape { animation:eq-cloak-walk .44s ease-in-out infinite alternate; }
.eq-staff,.eq-rune-glow,.eq-crystal-light { animation:eq-magic-light 3.8s ease-in-out infinite alternate; }
.eq-ambient-mote { animation:eq-mote-drift var(--duration,5s) var(--delay,0s) ease-in-out infinite alternate; }
.eq-water-line { animation:eq-water-shimmer 4.2s var(--delay,0s) ease-in-out infinite alternate; }
.eq-firelight { animation:eq-firelight 2.8s ease-in-out infinite alternate; }
.eq-chest-lid { transform-origin:0 -15px; }
.eq-open .eq-chest-lid { transform:translateY(-8px) rotate(-13deg); transition:transform .38s ease-out; }
.eq-open .eq-chest-treasure { opacity:1; }
.eq-chest-treasure { opacity:0; transition:opacity .3s ease-out; }
.eq-solved .eq-object-glow,.eq-open .eq-object-glow { opacity:.65; }
.eq-solved .eq-object-runes { fill:#c9eac6; }
.eq-door-leaf { transform-origin:0 0; transition:opacity .5s ease-out,transform .5s ease-out; }
.eq-open .eq-door-leaf,.eq-solved .eq-door-leaf { opacity:.13; transform:scaleX(.12); }
.eq-open .eq-door-sigil,.eq-solved .eq-door-sigil { opacity:.3; }
.eq-sense .eq-sense-ring { opacity:1; animation:eq-sense-ring 2.2s ease-out infinite; }
.eq-sense-ring { opacity:0; transform-origin:0 0; }
.eq-solved .eq-switch-lever { transform:rotate(22deg); }
.eq-switch-lever { transform-origin:0 -5px; transition:transform .24s ease-out; }
.eq-solved .eq-bridge-gap,.eq-open .eq-bridge-gap { opacity:0; }
.eq-bridge-whole { opacity:0; }
.eq-solved .eq-bridge-whole,.eq-open .eq-bridge-whole { opacity:1; animation:eq-bridge-form .7s ease-out both; }
.eq-object-unavailable { opacity:.65; }
.eq-restored-crystal .eq-crystal-light { animation:eq-restored-light 4s ease-in-out infinite alternate; }
@keyframes eq-breathe { to { transform:translateY(-.65px); } }
@keyframes eq-cloak-idle { to { transform:rotate(1.5deg); } }
@keyframes eq-stride { 0%,100% { transform:translateY(-1px) rotate(-11deg); } 50% { transform:translateY(1px) rotate(11deg); } }
@keyframes eq-arm-swing { 0%,100% { transform:rotate(7deg); } 50% { transform:rotate(-7deg); } }
@keyframes eq-walk-bob { to { transform:translateY(-1.2px); } }
@keyframes eq-cloak-walk { from { transform:rotate(-3deg) scaleY(.97); } to { transform:rotate(3deg) scaleY(1.03); } }
@keyframes eq-magic-light { from { opacity:.75; } to { opacity:1; } }
@keyframes eq-mote-drift { from { opacity:.22; transform:translate(-2px,2px); } to { opacity:.76; transform:translate(3px,-5px); } }
@keyframes eq-water-shimmer { from { opacity:.18; } to { opacity:.48; } }
@keyframes eq-firelight { from { opacity:.55; } to { opacity:.8; } }
@keyframes eq-sense-ring { from { opacity:.7; transform:scale(.8); } to { opacity:0; transform:scale(1.35); } }
@keyframes eq-bridge-form { from { opacity:.2; } to { opacity:1; } }
@keyframes eq-restored-light { to { opacity:1; filter:brightness(1.2); } }
@media (prefers-reduced-motion:reduce) {
  .eq-actor-art *, .eq-ambient-mote, .eq-water-line, .eq-firelight, .eq-rune-glow, .eq-crystal-light,
  .eq-sense .eq-sense-ring, .eq-bridge-whole, .eq-restored-crystal .eq-crystal-light {
    animation:none !important;
  }
  .eq-chest-lid, .eq-chest-treasure, .eq-door-leaf, .eq-switch-lever { transition:none !important; }

'use strict';
// Authored academy content is deliberately separate from the adventure question pool.
const Curriculum = (() => {
  const skills=['vocabulary','grammar','reading','listening','order','conversation'];

  const themes=[
    ['인사와 공손한 표현','Greetings and Politeness','상황에 맞게 인사하고 감사·사과·부탁을 전해요.'],
    ['자기소개','Introductions','이름, 출신, 사는 곳과 직업을 소개해요.'],
    ['하루의 일과','Daily Routines','매일 하는 일과 습관을 설명해요.'],
    ['음식과 카페','Food and Cafés','음식과 음료를 공손하게 주문해요.'],
    ['쇼핑과 돈','Shopping and Money','물건, 가격, 크기와 결제 방법을 확인해요.'],
    ['길 찾기와 교통','Directions and Transport','길 안내를 이해하고 대중교통 정보를 물어요.'],
    ['시간과 일정','Time and Schedules','요일, 날짜와 약속 시간을 확인해요.'],
    ['여행과 호텔','Travel and Hotels','숙박과 여행에 필요한 정보를 주고받아요.'],
    ['직장 영어','Workplace English','일터에서 소개하고 부탁과 지시를 확인해요.'],
    ['건강과 일상의 필요','Health and Daily Needs','몸 상태와 필요한 도움을 간단히 표현해요.'],

    ['실전 영어 미션','Practical Missions','카페, 길 찾기, 시장과 일터의 일을 영어로 해결해요.']
  ];
  const units=themes.map(([name,en,description],i)=>({id:`u${String(i+1).padStart(2,'0')}`,name,en,description,order:i+1,targetCount:i<10?45:25,objectives:skills.map(s=>`u${String(i+1).padStart(2,'0')}.${s}`)}));
  const objectives=units.flatMap(u=>skills.map(skill=>({id:`${u.id}.${skill}`,unitId:u.id,skill,name:`${u.name} · ${skillNames[skill]}`,description:`${u.description} ${skillNames[skill]}을 연습합니다.`})));
  const activities=[],expressions=[],diagnostics=[],missions=[];
  let cached;
  function register(pack) {
    const targets={units,objectives,activities,expressions,diagnostics,missions};
    for(const [key,target] of Object.entries(targets)) {
      const ids=new Set(target.map(x=>x.id));
      for(const entry of pack[key]||[]) {if(!entry?.id||ids.has(entry.id))throw new Error(`Curriculum duplicate or missing ${key} ID: ${entry?.id}`);ids.add(entry.id);}
    }
    for(const [key,target] of Object.entries(targets))target.push(...(pack[key]||[]));
    cached=undefined;
  }
  function index() {
    if(!cached)cached=Object.fromEntries(Object.entries({units,objectives,activities,expressions,diagnostics,missions}).map(([key,list])=>[key,Object.assign(Object.create(null),Object.fromEntries(list.map(x=>[x.id,x])))]));
    return cached;
  }

  // code | expression key(s) | tier | English stimulus | Korean task | answer | distractors/tokens | explanation | hint | optional accepted responses
  const codes={V:'vocabulary',G:'grammar',R:'reading',L:'listening',O:'order',C:'conversation'};
  function definePack(unitId,expressionText,rowText,start=1) {
    const ex=expressionText.trim()?expressionText.trim().split(/\r?\n/).filter(Boolean).map(row=>{const [id,english,ko]=row.split('|');return {id:`${unitId}.${id}`,unitId,english,ko};}):[];
    const rows=rowText.trim().split(/\r?\n/).filter(Boolean).map((row,i)=>{

        alternatives:accepted?accepted.split('~'):[],choices:type==='order'?options.split('~'):[answer,...options.split('~')],distractors:type==='order'?[]:options.split('~'),
        explanation,expressionIds,audioText:skill==='listening'?english:'',fallback:skill==='listening'?{type:'text',text:english}:null,hint,contentVersion:1};
    });
    register({expressions:ex,activities:rows});
  }
  return {units,activities,expressions,objectives,diagnostics,missions,skills,register,index,get,definePack};
})();

;

// Local backup import is a preview followed by an explicitly confirmed, verified transaction.
const Backup = (() => {
  const maxBytes=2*1024*1024,handles=new WeakMap(),versions=[1,2,3,4,5,7,8];
  const stagingKey='EnglishQuest.import.pending.v1',recoveryKey='EnglishQuest.import.recovery.v1';

  function structure(p){
    if(!object(p)||!versions.includes(p.version))return '지원하는 저장 버전이 아니에요.';
    if(typeof p.started!=='boolean'||!Number.isSafeInteger(p.level)||p.level<1||!Array.isArray(p.completed)
      ||p.completed.some(n=>!Number.isInteger(n)||n<1||n>3))return '게임 진행 정보의 형식이 올바르지 않아요.';
    for(const key of ['xp','gold','hp'])if(!Number.isSafeInteger(p[key])||p[key]<0)return '능력치와 금화는 올바른 정수여야 해요.';
    for(const key of ['learning','mistakes','settings','schedule','village','voice','rpg'])if(p[key]!==undefined&&!object(p[key]))return key+' 정보의 형식이 올바르지 않아요.';
    for(const key of ['exploration','academy'])if(p[key]!=null&&!object(p[key]))return key+' 정보의 형식이 올바르지 않아요.';
    for(const key of ['marked','history','achievements'])if(p[key]!==undefined&&!Array.isArray(p[key]))return key+' 목록의 형식이 올바르지 않아요.';
    const maps=[[p.academy,'records'],[p.academy,'expressions'],[p.academy,'units'],[p.academy,'missions'],
      [p.voice,'records'],[p.voice,'missions'],[p.village,'progress'],[p.village,'inventory'],[p.rpg,'equipped'],[p.rpg,'dungeons']];
    for(const [container,key] of maps)if(container?.[key]!==undefined&&!object(container[key]))return key+' 저장 구조를 확인해 주세요.';
    for(const key of ['recent','diagnostics','rewarded','badges'])if(p.academy?.[key]!==undefined&&!Array.isArray(p.academy[key]))return '아카데미 목록의 형식이 올바르지 않아요.';
    return '';
  }
  function describe(p){return {version:p.version,level:p.level,gold:p.gold,currentChapter:p.currentChapter,
    chapters:{forest:p.chapterComplete,village:!!p.village.progress[6].completed,exploration:!!p.exploration?.completedChapter},
    academyAttempts:p.academy?Object.values(p.academy.records).reduce((n,r)=>n+r.correct+r.wrong,0):0,
    academyCompleted:p.academy?Object.values(p.academy.records).filter(r=>r.correct>0).length:0,

    if(structure(profile))return null;

  }

    if(typeof text!=='string'||!text.trim())return {ok:false,error:'내용이 있는 JSON 백업 파일을 선택해 주세요.'};
    if(bytes(text)>maxBytes)return {ok:false,error:'백업 파일은 2 MiB 이하여야 해요.'};
    let parsed;try{parsed=JSON.parse(text);}catch{return {ok:false,error:'JSON 파일을 읽을 수 없어요. 원본 백업 파일을 확인해 주세요.'};}

      }catch{/* Keep the recovery copy if storage itself cannot restore the prior slot. */}
      if(restored)clean();
      return {ok:false,error:restored?'가져온 기록의 저장을 확인할 수 없어 이전 기록을 유지했어요.':
        '저장 공간을 사용할 수 없어 가져오기를 마치지 못했어요. 남아 있는 이전 기록과 복구 사본을 보존했어요.'};
    }
  }
  return {maxBytes,export:exportBackup,preview,commit,cancel};
})();

function revealDialogue(){
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const paragraph=app.querySelector('.dialogue-text');
 const fullText=paragraph.textContent;
 const reading=document.createElement('span');
 const ink=document.createElement('span');
 reading.className='dialogue-reserve';
 reading.textContent=fullText;
 ink.className='dialogue-ink';
 ink.setAttribute('aria-hidden','true');
 paragraph.replaceChildren(reading,ink);
 const start=performance.now();
 function frame(time){
  if(!ink.isConnected)return;
  const count=Math.min(fullText.length,Math.ceil((time-start)/19));
  ink.textContent=fullText.slice(0,count);
  if(count<fullText.length)requestAnimationFrame(frame);
 }
 requestAnimationFrame(frame);
}

// Returns true when this chapter handles the action. Restrict actions to their live scene.
function villageAction(action,id){
  const p=game.profile,s=game.screen;
  if(action==='chapters'&&['MAP','CHAPTER_COMPLETE','VILLAGE','VILLAGE_END'].includes(s)){change('CHAPTERS');return true;}
  if(s==='CHAPTERS'&&action==='chapter'){
    if(VillageEngine.selectChapter(p,Number(id))){save();if(+id===2)enterVillage();else change('MAP');}
    return true;
  }
  if(s==='PLAYER_SELECT'&&action==='item-use'){useVillageItem(id);return true;}
  if(s==='ANSWER_FEEDBACK'&&action==='broken-retry'){
    const task=Engine.retryBroken(p,game.battle);
    if(task){game.task=task;game.order=[];game.feedback=null;change('QUESTION_ACTIVE');}
    return true;
  }
  if(p.currentChapter!==2)return false;
  if(action==='map'&&['BOOK','DASHBOARD','DEFEAT'].includes(s)){enterVillage();return true;}
  if(action==='village-home'&&['QUESTS','LOCATION','SHOP','BAG','DIALOGUE','VILLAGE_END'].includes(s)){enterVillage();return true;}
  if(action==='quests'&&['VILLAGE','LOCATION'].includes(s)){change('QUESTS');return true;}
  if(action==='inventory'&&['VILLAGE','LOCATION'].includes(s)){game.purchaseNotice='';change('BAG');return true;}
  if(action==='destination'&&['VILLAGE','QUESTS','LOCATION'].includes(s)){
    const place=villagePlaces[id];if(place?.stage&&questStatus(place.stage)!=='locked')enterVillage(id);
    return true;
  }
  if(s==='VILLAGE'){
    if(action==='dashboard'){change('DASHBOARD');return true;}
    if(action==='book'){change('BOOK');return true;}
    if(action==='review'){openReview();return true;}
    if(action==='ending-village'&&p.village.progress[6].completed){change('VILLAGE_END');return true;}
    if(action==='train'){game.stage=4;startBattle(true);return true;}
  }
  if(s==='LOCATION'){
    const stage=villagePlaces[game.location].stage;
    if(action==='accept-quest'&&+id===stage&&VillageEngine.accept(p,stage)){save();change('LOCATION');return true;}
    if(action==='talk'&&+id===stage){showTalk(stage);return true;}
    if(action==='village-fight'&&+id===stage){game.stage=stage;startBattle();return true;}
    if(action==='shop'&&game.location==='market'){game.shopGear=false;game.offer=null;game.purchaseNotice='';change('SHOP');return true;}
  }
  if(s==='VILLAGE_END'&&action==='talk'&&id==='scenario'){showTalk('scenario');return true;}
  if(s==='DIALOGUE'){
    const session=game.dialogue;
    if(action==='reply'&&!game.dialogueResult&&session){
      const result=VillageEngine.reply(p,session,session.choices[Number(id)]);
      if(result){game.dialogueResult=result;save();change('DIALOGUE');AudioFX.play(result.correct?'correct':'wrong',p.settings);}
      return true;
    }
    if(action==='dialogue-next'&&game.dialogueResult){
      if(game.dialogueResult.done){if(session.stage==='scenario')change('VILLAGE_END');else enterVillage(villageQuest(session.stage).location);}
      else showTalk(session.stage);
      return true;
    }
  }
  if(s==='SHOP'){
    if(action==='shop-back'){enterVillage('market');return true;}
    if(action==='purchase'&&!game.offer){
      game.offer=VillageEngine.offer(p,id);game.purchaseNotice='';
      if(game.offer)change('SHOP');return true;
    }
    if(action==='buy-cancel'){game.offer=null;change('SHOP');return true;}
    if(action==='buy-confirm'&&game.offer){
      const offer=game.offer;game.offer=null;
      const purchased=VillageEngine.buy(p,offer);
      game.purchaseNotice=purchased?VillageEngine.items.find(i=>i.id===offer.id).name+' 구매 완료.':'가격이나 보유량이 달라졌어요. 다시 확인해 주세요.';
      if(purchased)save();
      change('SHOP');return true;
    }
  }
  if(s==='REWARD'&&action==='onwards'&&game.stage>=4){
    if(game.battle.training){enterVillage();return true;}
    if(game.stage===6){game.battle=null;change('VILLAGE_END');return true;}
    enterVillage(villageQuest(game.stage).location);return true;
  }
  return false;
}

// Recognition belongs to a single open activity. A transcript is never put on the profile.
function voiceContextScreen(){
  return ['VOICE_PRACTICE','QUESTION_ACTIVE','ANSWER_FEEDBACK'].includes(game.screen);
}
function voiceReturnHome(){return game.profile.currentChapter===2?'VILLAGE':'MAP';}
function silenceVoice(clearInput=true){
  SpeechInput.cancel();AudioFX.stop();
  const v=game.voice;
  if(!v)return;
  v.micState=SpeechInput.available()?'ready':'unavailable';
  v.micMessage='';v.transcript='';v.mismatch=false;
  if(clearInput)v.draft='';
}
function discardVoice(){
  silenceVoice();
  VoiceLearning.cancel(game.profile);
  game.voice=null;
}
function setupVoice(handle,origin,mission=null,history=[]){
  if(!handle)return false;
  SpeechInput.cancel();AudioFX.stop();
  if(mission&&handle.step>0&&!history.length){
    history=mission.ids.slice(0,handle.step).map(id=>{
      const a=voiceActivity(id);
      return {npc:a.npc,prompt:a.english,answer:a.answer,reply:a.replies[a.answer].english};
    });
  }
  game.voice={handle,activity:handle.activity,origin,mission,history,stage:'brief',result:null,
    micState:SpeechInput.available()?'ready':'unavailable',micTried:false,mismatch:false,micMessage:'',
    transcript:'',textMode:false,draft:'',noAudio:false,transcriptHint:false,translationHint:false};
  save();
  change(origin==='battle'?'QUESTION_ACTIVE':'VOICE_PRACTICE');
  return true;
}
function voiceFallback(v){
  if(v!==game.voice||!voiceContextScreen()||v.stage!=='active'||v.result)return;
  v.noAudio=true;
  VoiceLearning.assist(game.profile,v.handle,'fallback');
  if(v.activity.mode==='identify')v.translationHint=true;
  else v.transcriptHint=true;
  render();
}
function voicePlay(rate='normal'){
  const v=game.voice;
  if(!v||!voiceContextScreen())return;
  if(['requesting','listening','processing'].includes(v.micState)){
    SpeechInput.stop();
  }
  const spoken=v.result?(v.result.reply?.english||v.activity.english):v.activity.english;
  const nodes=[...app.querySelectorAll('.voice-prompt [lang="en"],.voice-playback button')]
    .filter(el=>el.textContent.trim()===spoken||el.dataset.id===rate);
  const ok=AudioFX.speak(spoken,game.profile.settings,()=>{if(isAural(v.activity))voiceFallback(v);},{
    rate,onStart:()=>nodes.forEach(el=>el.classList.add('speaking')),onEnd:()=>nodes.forEach(el=>el.classList.remove('speaking'))
  });
  if(!ok&&isAural(v.activity))voiceFallback(v);
}
function beginVoice(){
  const v=game.voice;
  if(!v||v.stage!=='brief')return;
  v.stage='active';
  if(isAural(v.activity)&&!AudioFX.canSpeak(game.profile.settings))voiceFallback(v);
  else {
    render();
    if(isAural(v.activity))voicePlay(game.profile.settings.speechRate);
  }
  app.querySelector('.voice-input button:not(:disabled)')?.focus({preventScroll:true});
}
function voiceMicStart(){
  const v=game.voice;
  if(!v||v.stage!=='active'||v.result||!isSpeakingTurn(v.activity))return;
  if(['requesting','listening','processing'].includes(v.micState))return;
  AudioFX.stop();v.transcript='';v.micMessage='';v.mismatch=false;v.micTried=true;
  const current=()=>game.voice===v&&voiceContextScreen()&&v.stage==='active'&&!v.result;
  SpeechInput.start({
    onState(state,reason){
      if(!current())return;
      v.micState=state;
      v.micMessage=({'audio-capture':'마이크를 찾을 수 없어요. 글로 답하거나 연결 후 다시 시도하세요.',
        network:'브라우저 음성 서비스에 연결하지 못했어요. 글로 계속할 수 있어요.',
        'no-match':'단어를 인식하지 못했어요. 다시 말하거나 글로 답해 주세요.',
        'no-speech':'음성이 들리지 않았어요. 다시 시도하거나 글로 답해 주세요.',
        stopped:'마이크를 중지했어요.'})[reason]||'';
      // Keep the prompt, typed response and keyboard focus intact on async status updates.
      const panel=app.querySelector('.mic-panel');
      const hadFocus=panel?.contains(document.activeElement);
      if(panel)panel.outerHTML=micPanel(v);
      const live=document.getElementById('voice-live');
      if(live)live.textContent=(micLabels[state]||state)+' '+v.micMessage;
      if(hadFocus)app.querySelector('[data-act="mic-stop"],[data-act="mic-start"]')?.focus({preventScroll:true});
    },
    onResult(transcript){
      if(!current())return;
      v.transcript=transcript.slice(0,360);v.micState='result';v.mismatch=false;
      const panel=app.querySelector('.mic-panel');
      if(panel)panel.outerHTML=micPanel(v);
      app.querySelector('[data-act="mic-confirm"]')?.focus({preventScroll:true});
    }
  });
}
function submitVoice(value,mode){
  const v=game.voice,p=game.profile;
  if(!v||v.stage!=='active'||v.result||typeof value!=='string'||!value.trim())return;
  SpeechInput.cancel();AudioFX.stop();
  const r=VoiceLearning.submit(p,v.handle,value,{mode});
  if(!r)return;
  save();
  if(r.retrySpeech){
    v.mismatch=true;v.micMessage='일부 단어가 다르게 인식되었어요. 천천히 다시 말하거나 글로 답해 보세요.';
    render();return;
  }
  v.result=r;v.stage='feedback';v.answerMode=mode;v.draft='';v.transcript='';
  if(v.mission){
    // History is constructed from authored lines, never from raw speech or free text.
    const authoredAnswer=mode==='choice'?value:r.correct?v.activity.answer:'다시 연습';
    v.history.push({npc:v.activity.npc,prompt:v.activity.english,answer:authoredAnswer,
      reply:r.reply?.english||v.activity.answer});
    if(v.history.length>20)v.history.shift();
  }
  if(v.origin==='battle'){
    game.feedback=r;change('ANSWER_FEEDBACK');
  }else change('VOICE_PRACTICE');
  AudioFX.play(r.correct?'correct':'wrong',p.settings);
}
function exitVoice(){
  const origin=game.voice?.origin;
  if(origin==='battle')return;
  discardVoice();
  change(origin==='today'?'TODAY':origin==='location'?'LOCATION':origin==='dashboard'?'DASHBOARD':'VOICE_HALL');
}
function voiceNext(){
  const v=game.voice;
  if(!v?.result||v.origin==='battle')return;
  if(v.mission&&!v.result.done){
    const handle=VoiceLearning.startMission(game.profile,v.mission.id);
    if(setupVoice(handle,v.origin,v.mission,v.history))beginVoice();
  }else if(!v.result.correct){
    if(setupVoice(VoiceLearning.start(game.profile,v.activity.id,{review:v.origin==='today'}),v.origin))beginVoice();
  }else exitVoice();
}
function launchReviewEntry(id,origin='today'){
  const a=voiceActivity(id);
  if(a){setupVoice(VoiceLearning.start(game.profile,id,{review:true}),origin);return;}
  game.reviewFrom=origin==='today'?'TODAY':'DASHBOARD';
  game.dailyLegacy=true;
  openReviewQuestion(id);
}
function voiceAction(action,id){
  const s=game.screen,p=game.profile,v=game.voice;
  const menuScreens=['MAP','VILLAGE','DASHBOARD','VOICE_HALL','TODAY','LOCATION','REVIEW','BOOK','CHAPTER_COMPLETE','VILLAGE_END'];
  if(action==='voice-hall'&&menuScreens.includes(s)){
    game.voiceTab=Object.hasOwn(voiceTabs,id)?id:'speak';change('VOICE_HALL');return true;
  }
  if(action==='today'&&menuScreens.includes(s)){change('TODAY');return true;}
  if(action==='voice-home'&&['VOICE_HALL','TODAY'].includes(s)){change(voiceReturnHome());return true;}
  if(action==='dashboard'&&['VOICE_HALL','TODAY'].includes(s)){change('DASHBOARD');return true;}
  if(s==='VOICE_HALL'){
    if(action==='voice-tab'&&Object.hasOwn(voiceTabs,id)){game.voiceTab=id;render();focusControl(action,id);return true;}
    if(action==='voice-lesson'&&voiceActivity(id)){setupVoice(VoiceLearning.start(p,id),'hall');return true;}
  }
  if(action==='voice-mission'&&['VOICE_HALL','LOCATION'].includes(s)){
    const m=voiceMission(id);
    if(m)setupVoice(VoiceLearning.startMission(p,id),s==='LOCATION'?'location':'hall',m);
    return true;
  }
  if(s==='TODAY'&&action==='daily-review'){
    if(VoiceLearning.today(p).due.some(entry=>entry.id===id))launchReviewEntry(id);
    return true;
  }
  if(s==='DASHBOARD'&&action==='recommended-review'){
    const recommendation=VoiceLearning.dashboard(p).recommendation;
    if(recommendation)launchReviewEntry(recommendation.id,'dashboard');
    return true;
  }
  if(s==='REVIEW'&&game.dailyLegacy&&['review-list','review-back'].includes(action)){
    game.dailyLegacy=false;game.reviewSession=null;change(game.reviewFrom);return true;
  }
  if(!voiceContextScreen()||!v)return false;
  if(action==='voice-market'&&v.result?.done&&v.mission?.id==='vp-shop'&&p.currentChapter===2){
    discardVoice();game.location='market';game.offer=null;game.purchaseNotice='';change('SHOP');return true;
  }
  if(action==='voice-exit'){exitVoice();return true;}
  if(action==='voice-begin'){beginVoice();return true;}
  if(action==='voice-next'){voiceNext();return true;}
  if(action==='voice-play'&&['normal','slow'].includes(id)){voicePlay(id);return true;}
  if(v.result||v.stage!=='active')return false;
  switch(action){
  case 'mic-start':voiceMicStart();break;
  case 'mic-stop':SpeechInput.stop();break;
  case 'mic-confirm':if(v.micState==='result'&&!v.mismatch)submitVoice(v.transcript,'speech');break;
  case 'mic-dispute':
    silenceVoice(false);v.textMode=true;render();document.getElementById('voice-answer')?.focus();break;
  case 'voice-text':
    silenceVoice(false);v.textMode=true;render();document.getElementById('voice-answer')?.focus();break;
  case 'voice-submit':submitVoice(document.getElementById('voice-answer')?.value,'text');break;
  case 'voice-choice':submitVoice(v.handle.choices[Number(id)],'choice');break;
  case 'voice-transcript':
    v.transcriptHint=!v.transcriptHint;
    if(v.transcriptHint)VoiceLearning.assist(p,v.handle,'transcript');
    render();focusControl(action,id);break;
  case 'voice-translation':
    v.translationHint=!v.translationHint;
    if(v.translationHint)VoiceLearning.assist(p,v.handle,'translation');
    render();focusControl(action,id);break;
  default:return false;
  }
  return true;
}
function leaveWhenHidden(){
  if(game.voice){
    silenceVoice();
    if(voiceContextScreen())render();
  }
}
app.addEventListener('input',event=>{
  if(event.target.id==='voice-answer'&&game.voice)game.voice.draft=event.target.value;
});
app.addEventListener('change',event=>{
  if(!event.target.hasAttribute('data-speech-volume'))return;
  game.profile.settings.speechVolume=Math.max(0,Math.min(1,Number(event.target.value)/100));
  save();
  if(!game.profile.settings.speechVolume)AudioFX.stop();
  if(game.voice?.stage==='active'&&isAural(game.voice.activity)&&!AudioFX.canSpeak(game.profile.settings))voiceFallback(game.voice);
  else if(game.voice&&voiceContextScreen())render();
  const mixer=app.querySelector('.speech-mixer');
  if(mixer){mixer.open=true;mixer.querySelector('input').focus({preventScroll:true});}
});
app.addEventListener('keydown',event=>{
  if(event.target.id==='voice-answer'&&event.key==='Enter'&&!event.isComposing){event.preventDefault();submitVoice(event.target.value,'text');}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)leaveWhenHidden();});
window.addEventListener('pagehide',leaveWhenHidden);

    context='<div class="actions">'+button('trial-play',icon('sound')+' 다시 듣기',{id:'normal',disabled:!play})+

      (run.showTranscript||!play?'<p class="trial-cue">'+(play?'원문':'글로 푸는 듣기')+' · <span lang="en">'+safe(q.phrase)+'</span></p>':'');
  }else if(q.type==='sentence'&&q.instruction.includes('___')&&q.chapter!==2){
    context='<p>'+safe(koreanExamples[q.tags[0]])+'</p>';
  }
  const controls=isOrder?'<div class="answer-line" aria-live="polite">'+(run.order.length?run.order.map(i=>safe(run.choices[i])).join(' '):'단어를 눌러 문장을 만드세요.')+

    '<div class="choices">'+run.choices.map((v,i)=>button('trial-choice','<span class="choice-index">'+String.fromCharCode(65+i)+'</span>'+safe(v),{id:i,cl:'choice'})).join('')+'</div>';
  return '<span class="eyebrow">'+(run.index+1)+' / 5 · '+trialRoom(run.id).focus+'</span><h3>'+safe(q.instruction)+'</h3>'+context+controls;
}

function setTrialAudioFallback(run,q,turn){
  if(game.screen!=='TRIAL_RUN'||game.trial!==run||run.question!==q||run.phase!=='question'||turn!==game.trialAudio)return;

}
function playTrial(rate=game.profile.settings.speechRate){

  if(q.type!=='listening'||run.phase!=='question')return;

  change('TRIAL_RUN');playTrial();

function submitTrial(value){
  const p=game.profile,run=game.trial;
  if(run.question.type==='listening'&&!AudioFX.canSpeak(p.settings))Trials.assist(p,run,'fallback');
  const feedback=Trials.answer(p,run,value);
  if(!feedback)return;
  game.trialAudio++;AudioFX.stop();save();render();
  AudioFX.play(run.phase==='victory'?'victory':feedback.correct?'correct':'wrong',p.settings);

function trialAction(action,id){
  const p=game.profile,run=game.trial;
  if(!run)return false;
  if(action==='trial-leave'){game.trialLeaving=true;AudioFX.stop();render();return true;}
  if(game.trialLeaving){
    if(action==='trial-stay'){game.trialLeaving=false;render();}
    if(action==='trial-leave-confirm'){Trials.leave(p);game.trial=null;game.trialLeaving=false;change('TRIALS');}
    return true;
  }
  if(action==='trial-next'){
    if(Trials.next(p,run)){
      if(run.phase==='results')change('TRIAL_RESULTS');
      else{change('TRIAL_RUN');playTrial();}
    }
    return true;
  }
  if(run.phase!=='question')return true;
  const index=Number(id);
  if(action==='trial-choice'&&run.question.type!=='order'&&Number.isInteger(index))submitTrial(run.choices[index]);
  if(action==='trial-tile'&&run.question.type==='order'&&Number.isInteger(index)&&index>=0&&index<run.choices.length&&!run.order.includes(index)){
    run.order.push(index);refreshTrialQuestion();
    app.querySelector('[data-act="trial-tile"]:not(:disabled),[data-act="trial-submit"]:not(:disabled)')?.focus({preventScroll:true});
  }
  if(action==='trial-undo'&&run.question.type==='order'){run.order.pop();refreshTrialQuestion();}
  if(action==='trial-submit'&&run.question.type==='order'&&run.order.length===run.choices.length)submitTrial(run.order.map(i=>run.choices[i]).join(' '));
  if(action==='trial-transcript'){Trials.assist(p,run,'transcript');refreshTrialQuestion();}
  if(action==='trial-play')playTrial(id==='slow'?'slow':'normal');
  return true;
}

  const hub=['MAP','VILLAGE',...sheets];
  if(action==='rpg-home'&&sheets.includes(s)){game.rpgMessage='';rpgHub();return true;}
  if(action==='profile'&&hub.includes(s)){game.rpgMessage='';change('PROFILE');return true;}
  if(action==='skills'&&hub.includes(s)){game.rpgMessage='';game.resetPending=false;change('SKILLS');return true;}
  if(action==='equipment'&&[...hub,'BAG','SHOP'].includes(s)){openGear();return true;}
  if(action==='trials'&&hub.includes(s)){game.trialSelection=game.trialSelection||'words';change('TRIALS');return true;}
  if(action==='class-open'&&s==='PROFILE'){game.classOrigin='profile';game.classPreview=r.classId||'vanguard';change('CLASSES');return true;}
  if(s==='CLASSES'){
    if(action==='class-preview'&&classInfo(id)){game.classPreview=id;render();focusControl(action,id);}
    if(action==='class-confirm'&&RPG.chooseClass(p,game.classPreview)){save();AudioFX.play('level',p.settings);if(game.classOrigin==='arrival')rpgHub();else change('PROFILE');}

  if(s==='SKILLS'){

    if(action==='skill-learn'&&!game.resetPending){
      const skill=RPG.skills.find(t=>t.id===(game.skillInspect||RPG.skills[0].id));
      if(skill&&RPG.learn(p,skill.id)){AudioFX.play('level',p.settings);rpgMessage(skill.name+' 습득 · 남은 포인트 '+r.availablePoints+' SP');}
    }
    if(action==='skill-reset'&&r.spentPoints){game.resetPending=true;render();app.querySelector('[data-act="skill-reset-cancel"]')?.focus();}
    if(action==='skill-reset-cancel'){game.resetPending=false;render();}
    if(action==='skill-reset-confirm'&&game.resetPending){
      game.resetPending=false;
      if(RPG.resetSkills(p))rpgMessage('스킬 포인트를 돌려받았어요. 사용 가능 '+r.availablePoints+' SP');else render();
    }
    return true;
  }
  if(action==='gear-slot'&&['PROFILE','EQUIPMENT'].includes(s)&&Object.hasOwn(slotNames,id)){openGear(id);focusControl(action,id);return true;}
  if(s==='EQUIPMENT'){
    const selected=gearInfo(game.gearInspect);
    if(action==='gear-inspect'&&gearInfo(id)?.slot===game.gearSlot){game.gearInspect=id;game.rpgMessage='';render();focusControl(action,id);}
    if(action==='gear-equip'&&selected&&RPG.equip(p,selected.id,game.gearSlot))rpgMessage(selected.name+' 장착 완료');
    if(action==='gear-unequip'&&selected&&r.equipped[game.gearSlot]===selected.id&&RPG.unequip(p,game.gearSlot))rpgMessage(selected.name+' 장착 해제');
    if(action==='gear-market'&&p.currentChapter===2){game.location='market';game.shopGear=true;game.offer=null;game.purchaseNotice='';change('SHOP');}
    return true;
  }
  if(s==='SHOP'&&!game.offer&&['shop-gear','shop-supplies'].includes(action)){game.shopGear=action==='shop-gear';game.purchaseNotice='';render();return true;}
  if(s==='TRIALS'){
    if(action==='trial-select'&&trialRoom(id)){game.trialSelection=id;render();focusControl(action,id);}
    if(action==='trial-start')startTrial(game.trialSelection||'words');
    return true;
  }
  if(s==='TRIAL_RUN')return trialAction(action,id);
  if(s==='TRIAL_RESULTS'&&action==='trial-again'){startTrial(game.trial.id);return true;}
  return false;

    if(label)label.textContent=first?first.name+' · 가까이 있습니다.':'표지판이나 인물 가까이 걸어가세요.';

  window.addEventListener('pagehide',()=>{resetInput();checkpoint();},{signal});

function academyCancelImport(dropPreview=true){AcademyUI.importEpoch=(AcademyUI.importEpoch||0)+1;AcademyUI.importBusy=false;if(AcademyUI.notice==='백업 내용을 검사하고 있어요.')AcademyUI.notice='파일 읽기를 취소했어요.';if(dropPreview){if(AcademyUI.backup)Backup.cancel(AcademyUI.backup.handle);AcademyUI.backup=null;}}
function academyAction(action,id){
 if(!action.startsWith('academy-'))return false;
 const p=game.profile,h=Academy.current(p),a=action.slice(8);
 if(a==='enter'){if(!p.started)return true;AcademyUI.returnTo=game.screen;AcademyUI.notice='';change('ACADEMY');return true;}
 if(!game.screen.startsWith('ACADEMY'))return true;
 if(a==='home'){change(p.started?'ACADEMY':'TITLE');return true;}
 if(a==='exit'){if(p.started)rpgHub();else change('TITLE');return true;}
 if(a==='progress'){change('ACADEMY_PROGRESS');return true;}
 if(a==='backup'){AcademyUI.notice='';change('ACADEMY_BACKUP');return true;}
 if(a==='tier'){Academy.setTier(p,Number(id),'manual');save();render();return true;}
 if(a==='auto-tier'){Academy.setTier(p,Academy.recommendation(p).tier,'auto');save();render();return true;}
 if(a==='unit'){if(Curriculum.units.some(u=>u.id===id)){AcademyUI.unitId=id;change('ACADEMY_UNIT');}return true;}
 if(a==='lesson'||a==='skip'){academyStart(Academy.startUnit(p,id));return true;}
 if(a==='mode'){academyStart(Academy.startMode(p,id));return true;}
 if(a==='exact'){academyStart(Academy.startExact(p,id));return true;}
 if(a==='diagnostic'){academyStart(Academy.startDiagnostic(p));return true;}
 if(a==='mission'){academyStart(Academy.startMission(p,id));return true;}
 if(a==='review'){academyStart(Academy.startReview(p));return true;}
 if(a==='export'&&game.screen==='ACADEMY_BACKUP'){
  try{const out=Backup.export(p),url=URL.createObjectURL(new Blob([out.text],{type:'application/json'})),link=document.createElement('a');link.href=url;link.download=out.filename;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);AcademyUI.notice='백업 파일 다운로드를 요청했어요. 브라우저의 다운로드 목록을 확인해 주세요.';}catch{AcademyUI.notice='백업 파일을 만들지 못했어요. 기존 기록은 유지됩니다.';}render();return true;
 }
 if(a==='import-cancel'){academyCancelImport();AcademyUI.notice='가져오기를 취소했어요. 현재 기록은 그대로입니다.';render();return true;}
 if(a==='import-confirm'&&game.screen==='ACADEMY_BACKUP'&&AcademyUI.backup){const result=Backup.commit(AcademyUI.backup.handle,{confirm:true});academyCancelImport();if(result.ok){Academy.close(p);game.profile=result.profile;game.battle=null;game.task=null;game.voice=null;game.trial=null;AcademyUI.notice='기록을 가져왔고 저장된 내용까지 확인했어요.';}else AcademyUI.notice=result.error;render();return true;}
 if(game.screen!=='ACADEMY_RUN'||!h)return true;
 if(a==='next'){if(Academy.advance(p,h)){academyResetQuestion();save();render();academyFocus();}return true;}
 if(a==='retry'){if(Academy.retry(p,h)){academyResetQuestion();render();academyFocus();}return true;}
 if(h.phase!=='question')return true;
 if(a==='mic-stop'){SpeechInput.stop();AcademyUI.micState='ready';AcademyUI.micNotice='마이크를 중지했어요.';render();return true;}
 if(a==='mic-start'&&h.activity.skill==='conversation'){
  if(['requesting','listening','processing'].includes(AcademyUI.micState))return true;
  AudioFX.stop();
  const current=()=>game.screen==='ACADEMY_RUN'&&Academy.current(p)===h&&h.phase==='question';
  SpeechInput.start({onState(state){if(!current())return;AcademyUI.micState=state;AcademyUI.micNotice=({requesting:'마이크 권한을 기다리고 있어요.',listening:'말씀해 주세요.',processing:'음성을 확인하고 있어요.',denied:'마이크 권한이 없어요. 보기나 글로 답할 수 있어요.',unavailable:'음성을 사용할 수 없어요. 보기나 글로 답해 주세요.',timeout:'음성이 들리지 않았어요. 다시 시도할 수 있어요.'})[state]||'';const el=document.getElementById('academy-mic-status');if(el)el.textContent=AcademyUI.micNotice;},onResult(text){if(!current())return;const result=Academy.answer(p,h,text.slice(0,240),{mode:'speech'});if(result?.retrySpeech){AcademyUI.micNotice='저작된 답변과 일치하지 않았어요. 오답으로 기록하지 않았습니다. 다시 말하거나 보기를 사용해 주세요.';render();}else if(result){academySilence();save();render();academyFocus('.academy-feedback h3');AudioFX.play(result.correct?'correct':'wrong',p.settings);}}});return true;
 }
 if(a==='text-submit'&&h.activity.skill==='conversation'){
  const value=document.getElementById('academy-text-answer')?.value?.trim();if(!value)return true;
  const result=Academy.answer(p,h,value,{mode:'text'});if(result){academySilence();save();render();academyFocus('.academy-feedback h3');AudioFX.play(result.correct?'correct':'wrong',p.settings);}return true;
 }
 if(['hint','translation','transcript'].includes(a)){Academy.assist(p,h,a);AcademyUI[a]=true;render();app.querySelector('[data-act="'+action+'"]')?.focus();return true;}
 if(a==='listen'&&h.activity.skill==='listening'){
  const fallback=()=>{if(Academy.current(p)===h&&h.phase==='question'){Academy.assist(p,h,'fallback');AcademyUI.transcript=true;render();}};
  if(!AudioFX.speak(h.activity.audioText,p.settings,fallback,{rate:id,onStart:()=>{if(Academy.current(p)===h)Academy.hear(p,h);}}))fallback();return true;
 }
 if(a==='word'&&h.activity.type==='order'){const i=Number(id);if(Number.isInteger(i)&&i>=0&&i<h.choices.length&&!AcademyUI.words.includes(i)){AcademyUI.words.push(i);render();app.querySelector('[data-act="academy-word"]:not(:disabled),[data-act="academy-submit"]:not(:disabled)')?.focus();}return true;}
 if(a==='undo'){const index=AcademyUI.words.pop();render();app.querySelector('[data-act="academy-word"][data-id="'+index+'"]')?.focus();return true;}
 let value;
 if(a==='answer'&&h.activity.type!=='order'){const i=Number(id);if(Number.isInteger(i)&&i>=0&&i<h.choices.length)value=h.choices[i];}
 if(a==='submit'&&h.activity.type==='order'&&AcademyUI.words.length===h.choices.length)value=AcademyUI.words.map(i=>h.choices[i]).join(' ');
 if(value!==undefined){const result=Academy.answer(p,h,value);if(result){academySilence();AudioFX.stop();save();render();academyFocus('.academy-feedback h3');AudioFX.play(result.correct?'correct':'wrong',p.settings);}}
 return true;
}

}
function startBattle(training=false){
 const b=training?Engine.training(game.profile):Engine.battle(game.profile,game.stage);if(!b)return;
 game.battle=b;game.task=null;game.effect='ready';game.amount='';game.displayHp=null;
 game.guarded=false;game.battleIntent='normal';
 game.battleMaxHp=Engine.stats(game.profile).maxHp;game.battleLevel=game.profile.level;
 game.achievementStart=[...game.profile.achievements];change('BATTLE_READY');
}
function listen(rate=game.profile.settings.speechRate){
 const q=game.task?.question;
 if(!q||q.type!=='listening')return;
 const fallback=()=>{if(['QUESTION_ACTIVE','REVIEW'].includes(game.screen)&&game.task?.question===q){game.speechFallback=true;markQuestionAssist('fallback');render();}};
 if(!readAloud(q.phrase,fallback,rate))fallback();
}
function selectAbility(ability){
 const task=Engine.select(game.profile,game.battle,ability);
 if(!task)return;
 game.ability=ability;game.task=task;game.speechFallback=false;game.order=[];game.questionAssists=[];game.showKo=false;
 if(task.voiceHandle){setupVoice(task.voiceHandle,'battle');return;}
 change('QUESTION_ACTIVE');
 if(task.question.type==='listening')listen();
}
function markQuestionAssist(aid){
 if(!game.questionAssists.includes(aid))game.questionAssists.push(aid);
}
function questionHelp(){
 const aids=game.questionAssists.slice();
 if(game.task?.question.type==='listening'&&!AudioFX.canSpeak(game.profile.settings)&&!aids.includes('fallback'))aids.push('fallback');
 return {assisted:aids.length>0,aids};
}
function submitAnswer(value){
 if(game.screen==='REVIEW'){
  const result=Engine.answerReview(game.profile,game.reviewSession,value,Date.now(),questionHelp());
  if(!result)return;
  game.reviewResult=result;AudioFX.stop();save();render();
  AudioFX.play(result.correct?'correct':'wrong',game.profile.settings);
  return;
 }
 const result=Engine.answer(game.profile,game.battle,value,questionHelp());
 if(!result)return;
 game.feedback=result;save();change('ANSWER_FEEDBACK');
 AudioFX.play(result.correct?'correct':'wrong',game.profile.settings);
}
function currentIntent(b){
 if(Engine.golemBreak(b))return 'break';
 return Engine.charging(b)?'charge':Engine.heavy(b)||Engine.diving(b)||Engine.pulsing(b)?'heavy':'normal';
}
// Commit the engine result first. Only the presentation waits for the weapon to make contact.
function animateAction(screen, effect, before, amount, message, impactSound, done){
 const fast=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 const impactTime=fast?12:({sword:360,fire:580,enemy:370,heavy:370,heal:280,voice:480,burst:480,echo:280}[effect]||240);
 const endTime=fast?75:effect==='fire'?1050:900;
 game.displayHp=before;game.effect=effect;game.amount='';game.message=message;
 change(screen);
 game.timer=setTimeout(()=>{
  game.displayHp=null;game.amount=amount;
  if(impactSound)AudioFX.play(impactSound,game.profile.settings);
  updateBattle(app.querySelector('.battle'));
  game.timer=setTimeout(()=>{game.amount='';done();},endTime-impactTime);
 },impactTime);
}
function resolveTurn(){
 const b=game.battle,p=game.profile;
 const before=[b.hp,b.enemyHp];
 const result=Engine.playerAction(p,b);
 if(!result)return;
 const effect=b.correct?b.ability:'miss';
 const amount=result.damage?'−'+result.damage:effect==='heal'?'+'+result.healing:'';
 game.guarded=result.guard;
 let message='말의 빛이 흩어집니다.';
 if(result.damage)message=abilityInfo[b.ability][0]+'이 적중했습니다!'+(result.counterBonus?' 방패 반격 보너스 발동.':'');
 if(result.guard)message=effect==='echo'?'메아리 방패를 펼쳤습니다. 다음 반격 피해가 줄어듭니다.':'수호 방패를 펼쳤습니다.';
 if(effect==='heal')message='치유의 빛이 체력을 '+result.healing+' 회복합니다.';
 if(result.won)game.reward=Engine.reward(p,b);
 save();
 AudioFX.play(b.correct?b.ability:'wrong',p.settings);
 animateAction('PLAYER_ACTION',effect,before,amount,message,result.damage?'impact':null,()=>{
  if(result.won){
   game.effect='win';change('VICTORY');AudioFX.play(b.stage===3||b.stage===6?'bossWin':'victory',p.settings);return;
  }
  resolveEnemyTurn(b,p);
 });
}
function resolveEnemyTurn(b,p){
 const enemyBefore=[b.hp,b.enemyHp];
 const hit=Engine.enemyAction(p,b);
 if(!hit)return;
 let nextEffect=hit.charging?'charge':hit.heavy||hit.dive||hit.pulse?'heavy':'enemy';
 if(hit.interrupted)nextEffect='interrupt';
 let message=Engine.enemies[b.stage-1].name+'의 반격 · 피해 '+hit.damage;
 if(hit.interrupted)message='문장을 복원했습니다. 골렘의 룬이 꺼져 공격이 중단됐어요.';
 else if(hit.charging)message='왕이 마력을 모읍니다. 다음 턴 강타에 대비하세요!';
 else if(hit.guarded)message='방패로 피해 '+hit.prevented+' 감소 · 받은 피해 '+hit.damage+(hit.counterReady?' · 반격 준비 완료':'');
 else if(hit.heavy||hit.dive||hit.pulse)message=(hit.dive?'그림자 급강하':hit.pulse?'메아리 파동':'왕관 강타')+' · 피해 '+hit.damage;
 if(hit.lost)save();
 if(hit.charging)AudioFX.play('charge',p.settings);
 const cue=hit.interrupted?'runeBreak':hit.guarded?'shieldHit':b.stage>=4?['crow','wisp','golem'][b.stage-4]:hit.heavy?'heavy':'enemy';
 animateAction('ENEMY_ACTION',nextEffect,enemyBefore,hit.damage?'−'+hit.damage:'',message,hit.charging?null:cue,()=>{
   game.effect=hit.lost?'lose':'';game.guarded=false;game.battleIntent=currentIntent(b);
   if(hit.lost)AudioFX.play('defeat',p.settings);
   change(hit.lost?'DEFEAT':'PLAYER_SELECT');
 });
}
function readAloud(text,onError,rate=game.profile.settings.speechRate){
 const matches=[...app.querySelectorAll('[lang="en"],.spoken-word')].filter(el=>el.textContent.trim()===text);
 if(!matches.length){
   const player=app.querySelector('[data-act="replay"]');
   if(player)matches.push(player);
 }
 return AudioFX.speak(text,game.profile.settings,onError,{
   rate,onStart:()=>matches.forEach(el=>el.classList.add('speaking')),
   onEnd:()=>matches.forEach(el=>el.classList.remove('speaking'))
 });
}
function openReview(){
 game.dailyLegacy=false;game.reviewFrom=game.screen;game.reviewSession=null;game.reviewResult=null;change('REVIEW');
}
function openReviewQuestion(id){
 const session=Engine.startReview(game.profile,id);
 if(!session)return;
 game.reviewSession=session;game.reviewResult=null;game.task=session;game.order=[];game.speechFallback=false;game.showKo=false;game.questionAssists=[];
 change('REVIEW');
 if(session.question.type==='listening')listen();
}
function focusControl(action,id){
 const match=Array.from(app.querySelectorAll('button[data-act]')).find(b=>b.dataset.act===action&&b.dataset.id===id);
 match?.focus({preventScroll:true});
}
function handleQuestionControl(action,id){
 const index=Number(id), task=game.task;
 if(!task)return;
 const choices=task.choices;
 if(action==='choice'&&task.question.type!=='order'&&Object.hasOwn(choices,index))submitAnswer(choices[index]);
 if(action==='word'&&task.question.type==='order'&&Object.hasOwn(choices,index)&&!game.order.includes(index)){
  game.order.push(index);render();app.querySelector('[data-act="word"]:not(:disabled),[data-act="submit-order"]:not(:disabled)')?.focus({preventScroll:true});
 }
 if(action==='undo'){game.order.pop();render();app.querySelector('[data-act="word"]:not(:disabled)')?.focus({preventScroll:true});}
 if(action==='submit-order'&&task.question.type==='order'&&game.order.length===choices.length)submitAnswer(game.order.map(i=>choices[i]).join(' '));
 if(action==='replay')listen(id==='slow'?'slow':'normal');
 if(action==='legacy-ko'){game.showKo=true;markQuestionAssist('translation');render();focusControl(action,id);}
 if(action==='transcript'){game.speechFallback=true;markQuestionAssist('transcript');render();focusControl(action,id);}
}
function dispatch(action,id){
 const p=game.profile;
 // Detached controls cannot reach this function. Validate each transition as well.
 if(action==='speak'){readAloud(id);return;}
 if(action==='settings'){openSettings();return;}
 if(game.screen==='PAUSED'){
  if(action==='close')closeSettings();
  if(action==='reset'){game.confirm='reset';showSettings();}
  if(action==='cancel-confirm'){if(game.confirm==='new')closeSettings();else{game.confirm='';showSettings();}}
  if(action==='confirm'&&game.confirm){
   const mode=game.confirm;game.confirm='';
   if(mode==='new')startNew();
   else{const cfg=p.settings;game.profile=Engine.fresh();game.profile.settings=cfg;game.battle=null;save();change('TITLE');}
  }
  if(action==='to-title'){game.battle=null;change('TITLE');}
  return;
 }
 if(typeof academyAction==='function'&&academyAction(action,id))return;
 if(typeof exploreAction==='function'&&exploreAction(action,id))return;
 if(rpgAction(action,id))return;
 if(voiceAction(action,id))return;
 if(villageAction(action,id))return;
 if(action==='map'&&['BOOK','DEFEAT','CHAPTER_COMPLETE','LEARNING','DASHBOARD'].includes(game.screen)){game.battle=null;change('MAP');return;}
 if(action==='book'&&['MAP','CHAPTER_COMPLETE'].includes(game.screen)){change('BOOK');return;}
 if(action==='review'&&['MAP','DEFEAT','BOOK','CHAPTER_COMPLETE','DASHBOARD'].includes(game.screen)){openReview();return;}
 switch(game.screen){
 case 'TITLE':
  if(action==='new'){if(p.started)openSettings('new');else startNew();}
  if(action==='continue'&&p.started)offerClass();
  break;
 case 'INTRO':
  if(action==='intro-skip'||(action==='intro-next'&&game.page===2))offerClass();
  else if(action==='intro-next'){game.page++;render();}
  break;
 case 'MAP':
  if(action==='dashboard')change('DASHBOARD');
  if(action==='map-pin'&&[1,2,3].includes(+id)){game.mapSelection=+id;render();focusControl(action,id);}
  if(action==='stage'&&Number.isInteger(+id)&&+id>=1&&+id<=p.unlocked){game.stage=+id;game.page=0;game.flipped.clear();change('LEARNING');}
  if(action==='ending'&&p.chapterComplete)change('CHAPTER_COMPLETE');
  break;
 case 'LEARNING':{
  const cards=stageCards[game.stage-1];
  if(['lesson-flip','lesson-mark'].includes(action)&&cards.slice(game.page*2,game.page*2+2).some(c=>c.id===id)){
   if(action==='lesson-mark'){Engine.mark(p,id);save();}
   else if(game.flipped.has(id))game.flipped.delete(id);
   else{game.flipped.add(id);Engine.teach(p,[id]);save();}
   render();focusControl(action,id);
  }
  if(action==='lesson-prev'&&game.page>0){game.page--;render();}
  if(action==='lesson-next'){
   Engine.teach(p,cards.slice(game.page*2,game.page*2+2).map(item=>item.id));save();
   if((game.page+1)*2>=cards.length)startBattle();else{game.page++;render();}
  }break;}
 case 'BATTLE_READY':if(action==='fight'){game.effect='';change('PLAYER_SELECT');}break;
 case 'PLAYER_SELECT':if(action==='ability')selectAbility(id);break;
 case 'QUESTION_ACTIVE':handleQuestionControl(action,id);break;
 case 'ANSWER_FEEDBACK':if(action==='resolve')resolveTurn();break;
 case 'VICTORY':if(action==='rewards'){change('REWARD');if(game.reward.levelUp)AudioFX.play('level',p.settings);}break;
 case 'REWARD':if(action==='onwards'){game.mapSelection=0;game.battle=null;change(game.stage===3?'CHAPTER_COMPLETE':'MAP');}break;
 case 'DEFEAT':if(action==='retry')startBattle(!!game.battle.training);break;
 case 'REVIEW':
  if(action==='review-one'&&!game.reviewSession)openReviewQuestion(id);
  else if(action==='review-list'){AudioFX.stop();game.reviewSession=null;game.reviewResult=null;render();}
  else if(action==='review-back'){game.reviewSession=null;change(game.reviewFrom);}
  else if(game.reviewSession&&!game.reviewResult)handleQuestionControl(action,id);
  break;
 }
}
function handleClick(event){
 const el=event.target.closest('button[data-act]');
 if(!el||!el.isConnected||el.disabled||(event.detail>1&&!['word','trial-tile','explore-word','academy-word'].includes(el.dataset.act)))return;
 if(game.screen==='PAUSED'&&!pauseDialog.contains(el))return;
 AudioFX.play('ui',game.profile.settings);dispatch(el.dataset.act,el.dataset.id);
}
app.tabIndex=-1;app.addEventListener('click',handleClick);pauseDialog.addEventListener('click',handleClick);
pauseDialog.setAttribute('aria-label','게임 설정');
pauseDialog.addEventListener('cancel',e=>{e.preventDefault();if(game.confirm==='reset'){game.confirm='';showSettings();}else closeSettings();});
pauseDialog.addEventListener('change',e=>{
 const setting=e.target.dataset.setting;
 if(setting==='speechVolume'){game.profile.settings.speechVolume=Math.max(0,Math.min(1,Number(e.target.value)/100));AudioFX.stop();save();}
 if(setting==='speechRate'){game.profile.settings.speechRate=e.target.value==='slow'?'slow':'normal';AudioFX.stop();save();}
 if(['sound','volume','voice'].includes(setting)){
  game.profile.settings[setting]=setting==='volume'?Number(e.target.value)/100:e.target.checked;
  if(setting==='voice'&&!e.target.checked)AudioFX.stop();save();
 }
});
document.addEventListener('keydown',e=>{if(e.defaultPrevented)return;if(e.key==='Escape'&&!e.repeat&&game.screen!=='PAUSED'){e.preventDefault();openSettings();}});
render();

</script></body></html>
