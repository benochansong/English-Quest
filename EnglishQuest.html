#app:focus { outline: none; }

/* Motion is confined to the illustrated stage; the command area stays still. */
.title { isolation: isolate; background: #142e32; }
.title::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background: radial-gradient(ellipse 40% 59% at 50% 52%, #091b21ce 0%, #09192383 59%, transparent 100%),
              linear-gradient(0deg, #061519aa, transparent 32%, transparent 88%, #0b141b66);
}
.title .title-art { opacity: 1; }
.title .title-content { z-index: 1; }
.title h1 { text-shadow: 0 3px 0 #413d33, 0 6px 20px #06161e, 0 0 55px #e5d39f25; }
.combatant { transform-origin: center bottom; }
.combatant svg { width: 100%; height: 100%; }
.hero-art, .slime-art { display: block; }
.portrait .rowan-art { width: 100%; display: block; }
.arena .enemy { height: 58%; }
.arena .enemy.boss { height: 73%; }
.forest-mist { animation: drift-mist 20s ease-in-out infinite alternate; }
.firefly { animation: lantern 4.8s var(--delay, 0s) ease-in-out infinite alternate; }
.dialogue p { animation: reveal-dialogue .42s ease-out both; }
.reward { animation: reward-rise .55s ease-out both; }
.arena[data-fx="ready"] .enemy.boss { animation: king-arrives .75s ease-out both; }
.arena[data-fx="sword"] .hero { animation: sword-strike .62s ease-out both; }
.arena[data-fx="sword"] .enemy, .arena[data-fx="fire"] .enemy { animation: struck .4s .22s ease-out both; }
.arena[data-fx="fire"] .hero { animation: casting .56s ease-in-out both; }
.arena[data-fx="guard"] .hero { transform: translateX(-2%) rotate(-4deg); filter: drop-shadow(0 0 10px #8ae6ff); }
.arena[data-fx="heal"] .hero { animation: recovery .64s ease-out both; }
.arena[data-fx="enemy"] .enemy { animation: jelly-lunge .62s ease-out both; }
.arena[data-fx="enemy"] .hero { animation: hero-hit .4s .2s ease-out both; }
.arena[data-fx="win"] .enemy { animation: shatter .7s ease-out both; }
.arena[data-fx="win"] .hero { animation: salute .75s ease-in-out both; }
.arena[data-fx="lose"] .hero { animation: wounded .7s ease-out both; }
.arena[data-fx="miss"] .hero { animation: falter .45s ease-out both; }
.arena .fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.arena[data-fx="sword"] .fx::after {
  content: ''; position: absolute; top: 35%; left: 32%; width: 45%; height: 24%;
  border-bottom: 6px solid #fff0bb; border-radius: 50%; filter: drop-shadow(0 0 7px #ffce75);
  animation: slash-trail .55s ease-out both;
}
.arena[data-fx="fire"] .fx::before {
  content: ''; position: absolute; top: 56%; left: 29%; width: 11%; height: 7%;
  border-radius: 90% 45% 45% 90%;
  background: linear-gradient(90deg, transparent, #de7848 45%, #ffdb8b 83%, #fffad8);
  filter: drop-shadow(0 0 9px #ffb350);
  animation: fire-flight .55s ease-in both;
}
.arena[data-fx="fire"] .fx::after, .arena[data-fx="win"] .fx::after {
  content: ''; position: absolute; top: 42%; right: 19%; width: 12%; aspect-ratio: 1;
  border: 4px dotted #ffda95; border-radius: 50%; animation: impact-ring .44s .28s ease-out both;
}
.arena[data-fx="guard"] .fx::before {
  content: ''; position: absolute; left: 15%; bottom: 7%; width: min(16%, 150px); height: 49%;
  border-radius: 28% 55% 52% 37% / 18% 29% 67% 72%;
  border: 2px solid #baf6fb; box-shadow: inset 0 0 18px #79daff77, 0 0 9px #79daff77;
  background: linear-gradient(145deg, #acf2ff4d, #69bee41c); animation: ward .55s ease-out both;
}
.arena[data-fx="heal"] .fx::before, .arena[data-fx="win"] .fx::before {
  content: ''; position: absolute; bottom: 13%; left: 18%; width: 8px; height: 8px;
  color:#b9ffb5; background:currentColor; transform:rotate(45deg);
  box-shadow: 17px -37px 0 -1px currentColor, -38px -19px 0 -2px currentColor, 45px -12px 0 -2px currentColor,
              -16px -66px 0 -1px currentColor, 31px -93px 0 -2px currentColor, 58px -58px 0 -1px currentColor;
  animation: runes-rise .7s ease-out both;
}
.arena[data-fx="win"] .fx::before { color: #f5d48b; }
@keyframes drift-mist { to { transform: translateX(19px); opacity: .65; } }
@keyframes lantern { 0%, 15% { opacity: .27; } 75%, 100% { opacity: .97; transform: translate(5px,-8px); } }
@keyframes reveal-dialogue { from { opacity: .15; transform: translateY(3px); } }
@keyframes reward-rise { from { opacity: .2; transform: translateY(7px); } }
@keyframes king-arrives { from { transform: translateY(-27%) scale(.77); opacity: .1; } 72% { transform: scale(1.09,.91); } }
@keyframes sword-strike { 0%,100% { transform: translateX(0); } 24% { transform: translateX(-8%) rotate(-5deg); } 58% { transform: translateX(27%) rotate(8deg); } }
@keyframes struck { 25% { transform: translateX(9%) scale(.93,1.06); filter: brightness(1.75); } 75% { transform: scale(1.05,.93); } }
@keyframes casting { 54% { transform: translateY(-5px) rotate(-4deg); filter: drop-shadow(0 0 8px #f4be7b); } }
@keyframes recovery { 45% { filter: drop-shadow(0 0 16px #91ebb3); } }
@keyframes jelly-lunge { 20% { transform: scale(1.12,.8); } 52% { transform: translate(-25%,-4%) scale(.95,1.05); } }
@keyframes hero-hit { 30% { transform: translateX(-9%) rotate(-4deg); filter: brightness(1.6); } }
@keyframes shatter { 35% { filter: brightness(1.6); transform: scale(1.08,.92); } to { opacity: 0; transform: scale(.8,.6); } }
@keyframes salute { 60%,100% { transform: translateY(-2%) rotate(-5deg); filter: drop-shadow(0 0 6px #dfcc84); } }
@keyframes wounded { to { transform: translateY(11%) rotate(-16deg); filter: saturate(.5); } }
@keyframes falter { 42% { transform: rotate(-3deg); filter: saturate(.45); } }
@keyframes slash-trail { 0% { opacity: 0; transform: rotate(-35deg) scale(.2); } 42% { opacity: 1; } 100% { opacity: 0; transform: rotate(-19deg) scale(1); } }
@keyframes fire-flight { 0% { opacity: 0; transform: scale(.2); } 22% { opacity: 1; } 90% { opacity: 1; } to { opacity: 0; left: 70%; } }
@keyframes impact-ring { from { opacity: 0; transform: scale(.2); } 20% { opacity: 1; } to { opacity: 0; transform: scale(1.45); } }
@keyframes ward { from { opacity: 0; transform: scale(.75); } 75% { opacity: 1; } to { opacity: .77; } }
@keyframes runes-rise { from { opacity: 0; } 34% { opacity: 1; } to { opacity: 0; transform: translateY(-52px) rotate(58deg); } }
@media (max-width: 700px) {
  /* The viewBox crops toward its centre on tall screens. Keep all four landmarks in the frame. */
  .title-art .painted-moon { transform: translate(-180px, -44px); }
  .title-art .painted-keep { transform: translate(-215px, 3px); }
  .title-art .painted-traveler { transform: translate(353px, 90px); }
  .title-art .painted-left { transform: translateX(436px); }
  .title-art .painted-right { transform: translateX(-432px); }
  .arena .hero { left: 5%; }
  .arena .enemy { right: 6%; }
  .title::after { background: radial-gradient(ellipse at 50% 48%, #081a20ba, #09192380 57%, transparent); }

const AudioFX = (() => {
  let context;
  const cues = {
    ui:      ['sine',     [392],              .06],
    correct: ['sine',     [523, 784],         .12],
    wrong:   ['sine',     [330, 294],         .13],
    sword:   ['sawtooth', [420, 170, 92],      .045],
    fire:    ['triangle', [175, 349, 587],     .085],
    guard:   ['sine',     [392, 523],          .1],
    enemy:   ['triangle', [147, 98],           .1],
    heal:    ['sine',     [392, 494, 587, 784],.1],
    victory: ['triangle', [392, 494, 587, 784],.16],
    level:   ['sine',     [523, 659, 784,1047],.14],
    defeat:  ['sine',     [392, 330, 262],     .18]
  };
  const aliases = {select:'ui', incorrect:'wrong', hit:'enemy', magic:'fire',
    healing:'heal', win:'victory', lose:'defeat', levelUp:'level', 'level-up':'level'};
  function play(effect, settings) {
    if (!settings?.sound || settings.volume <= 0) return;
    try {
      const AudioContext = globalThis.AudioContext || globalThis.webkitAudioContext;
      if (!AudioContext) return;
      context ||= new AudioContext();
      if (context.state === 'suspended') context.resume().catch(() => {});
      const [wave, notes, duration] = cues[aliases[effect] || effect] || cues.ui;
      const start = context.currentTime;
      for (const [i, frequency] of notes.entries()) {
        const at = start + i*duration;
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        oscillator.type = wave;
        oscillator.frequency.setValueAtTime(frequency, at);
        gain.gain.setValueAtTime(0.0001, at);
        gain.gain.exponentialRampToValueAtTime(Math.max(.0002, .13*settings.volume), at+.012);
        gain.gain.exponentialRampToValueAtTime(.0001, at+duration+.04);
        oscillator.connect(gain);
        gain.connect(context.destination);
        oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); };
        oscillator.start(at);
        oscillator.stop(at+duration+.05);
      }
    } catch { /* A disabled audio device should never interrupt a turn. */ }
  }
  function voice(settings) {
    if (!settings?.voice || !globalThis.SpeechSynthesisUtterance) return null;
    try {
      const voices = globalThis.speechSynthesis?.getVoices() || [];
      return voices.find(v => v.localService && /^en[-_]US$/i.test(v.lang))
        || voices.find(v => v.localService && /^en(?:[-_]|$)/i.test(v.lang)) || null;
    } catch { return null; }
  }

    try { globalThis.speechSynthesis?.cancel(); } catch { /* optional */ }
  }

    const english = voice(settings);
    if (!english) return false;
    try {
      stop();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.voice = english;
      utterance.lang = english.lang;
      utterance.rate = .83;
      utterance.onerror = event => {
        if (!['canceled','interrupted'].includes(event.error)) onError?.();
      };
      globalThis.speechSynthesis.speak(utterance);
      return true;
    } catch { return false; }
  }

})();

 const ink=document.createElement('span');
 reading.className='dialogue-reserve';
 reading.textContent=fullText;
 ink.className='dialogue-ink';
 ink.setAttribute('aria-hidden','true');
 paragraph.replaceChildren(reading,ink);
 const start=performance.now();
 function frame(time){
  if(!ink.isConnected)return;
  const count=Math.min(fullText.length,Math.ceil((time-start)/19));
  ink.textContent=fullText.slice(0,count);
  if(count<fullText.length)requestAnimationFrame(frame);
 }
 requestAnimationFrame(frame);
}

;
// Keep modal inputs outside the scene so opening settings preserves the current question.
function showSettings(){
 const p=game.profile, cfg=p.settings;
 const confirmLabel=game.confirm==='reset'?'저장 기록을 지울까요?':'새 모험으로 교체할까요?';
 const actions=game.confirm?'<h2>'+confirmLabel+'</h2><p>현재 모험과 학습 기록이 초기화됩니다.</p><div class="actions">'+button('confirm','초기화하고 계속',{cl:'primary'})+button('cancel-confirm','취소')+'</div>':
 '<div class="eyebrow">'+(game.pausedFrom==='TITLE'?'MAIN MENU':'PAUSED')+'</div><h2>설정</h2><label class="setting">효과음<input type="checkbox" data-setting="sound" '+(cfg.sound?'checked':'')+'></label><label class="setting">효과음 크기<input type="range" data-setting="volume" value="'+Math.round(cfg.volume*100)+'" min="0" max="100"></label><label class="setting">영어 발음<input type="checkbox" data-setting="voice" '+(cfg.voice?'checked':'')+'></label><div class="actions">'+button('close',game.pausedFrom==='TITLE'?'닫기':'계속하기',{cl:'primary'})+(game.pausedFrom!=='TITLE'?button('to-title','타이틀로'):'')+(p.started?button('reset','진행 초기화'):'')+'</div>';
 pauseDialog.innerHTML='<section class="modal">'+actions+'</section>';
 if(!pauseDialog.open)pauseDialog.showModal();
 if(game.confirm)pauseDialog.querySelector('[data-act="cancel-confirm"]').focus();
}
function openSettings(mode=''){
 if(['PLAYER_ACTION','ENEMY_ACTION','PAUSED'].includes(game.screen))return;
 game.pausedFrom=game.screen;game.confirm=mode;AudioFX.stop();game.screen='PAUSED';showSettings();
}
function closeSettings(){
 game.confirm='';game.screen=game.pausedFrom;pauseDialog.close();render();
 const focusButton=app.querySelector('[data-act="settings"]');
 if(focusButton)focusButton.focus({preventScroll:true});
}
function startNew(){
 const settings={...game.profile.settings};
 game.profile=Engine.fresh();game.profile.settings=settings;game.profile.started=true;
 game.page=0;game.battle=null;save();change('INTRO');
}
function startBattle(){
 const b=Engine.battle(game.profile,game.stage);if(!b)return;
 game.battle=b;game.task=null;game.effect='ready';game.amount='';change('BATTLE_READY');
}
function listen(){
 const q=game.task?.question;
 if(!q||q.type!=='listening')return;
 const fallback=()=>{if(game.screen==='QUESTION_ACTIVE'&&game.task.question===q){game.speechFallback=true;render();}};
 if(!AudioFX.speak(q.phrase,game.profile.settings,fallback))fallback();
}
function selectAbility(ability){
 const task=Engine.select(game.profile,game.battle,ability);
 if(!task)return;
 game.ability=ability;game.task=task;game.speechFallback=false;game.order=[];change('QUESTION_ACTIVE');
 if(task.question.type==='listening')listen();
}
function submitAnswer(value){
 const result=Engine.answer(game.profile,game.battle,value);if(!result)return;
 game.feedback=result;save();change('ANSWER_FEEDBACK');AudioFX.play(result.correct?'correct':'wrong',game.profile.settings);
}
function afterEffect(fn){
 const fast=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 game.timer=window.setTimeout(fn,fast?80:850);
}
function resolveTurn(){
 const b=game.battle,p=game.profile;
 const result=Engine.playerAction(p,b);if(!result)return;
 game.effect=b.correct?b.ability:'miss';game.amount='';
 if(result.damage)game.amount='−'+result.damage;
 if(game.effect==='heal')game.amount='+'+result.healing;
 game.message=b.correct?abilityInfo[b.ability][0]+' 발동'+(result.guard?' · 다음 피해 60% 감소':''):'말의 빛이 흩어집니다.';
 // Claim at the same checkpoint as the killing blow. No pending reward is saved.
 if(result.won){game.reward=Engine.reward(p,b);save();}
 change('PLAYER_ACTION');AudioFX.play(b.correct?b.ability:'wrong',p.settings);
 afterEffect(()=>{
  game.amount='';
  if(result.won){game.effect='win';change('VICTORY');AudioFX.play('victory',p.settings);return;}
  const enemy=Engine.enemyAction(p,b);if(!enemy)return;
  game.effect=enemy.charging?'charge':'enemy';game.amount=enemy.damage?'−'+enemy.damage:'';
  game.message=enemy.charging?'슬라임 왕이 힘을 모읍니다. 다음 턴에 수정핵을 노리세요!':Engine.enemies[b.stage-1].name+'의 반격 · 피해 '+enemy.damage;
  change('ENEMY_ACTION');if(!enemy.charging)AudioFX.play('enemy',p.settings);
  afterEffect(()=>{
   game.amount='';game.effect=enemy.lost?'lose':'';
   if(enemy.lost){save();AudioFX.play('defeat',p.settings);}
   change(enemy.lost?'DEFEAT':'PLAYER_SELECT');
  });
 });
}
function openReview(){
 game.reviewFrom=game.screen;game.reviewId='';game.reviewResult=null;change('REVIEW');
}
function dispatch(action,id){
 const p=game.profile;
 // Detached controls cannot reach this function. Validate each transition as well.
 if(action==='speak'){AudioFX.speak(id,p.settings);return;}
 if(action==='settings'){openSettings();return;}
 if(game.screen==='PAUSED'){
  if(action==='close')closeSettings();
  if(action==='reset'){game.confirm='reset';showSettings();}
  if(action==='cancel-confirm'){if(game.confirm==='new')closeSettings();else{game.confirm='';showSettings();}}
  if(action==='confirm'&&game.confirm){
   const mode=game.confirm;game.confirm='';
   if(mode==='new')startNew();
   else{const cfg=p.settings;game.profile=Engine.fresh();game.profile.settings=cfg;game.battle=null;save();change('TITLE');}
  }
  if(action==='to-title'){game.battle=null;change('TITLE');}
  return;
 }
 if(action==='map'&&['BOOK','DEFEAT','CHAPTER_COMPLETE','LEARNING'].includes(game.screen)){game.battle=null;change('MAP');return;}
 if(action==='book'&&['MAP','CHAPTER_COMPLETE'].includes(game.screen)){change('BOOK');return;}
 if(action==='review'&&['MAP','DEFEAT','BOOK','CHAPTER_COMPLETE'].includes(game.screen)){openReview();return;}
 switch(game.screen){
 case 'TITLE':
  if(action==='new'){if(p.started)openSettings('new');else startNew();}
  if(action==='continue'&&p.started)change('MAP');
  break;
 case 'INTRO':
  if(action==='intro-skip'||(action==='intro-next'&&game.page===2))change('MAP');
  else if(action==='intro-next'){game.page++;render();}
  break;
 case 'MAP':
  if(action==='stage'&&Number.isInteger(+id)&&+id>=1&&+id<=p.unlocked){game.stage=+id;game.page=0;change('LEARNING');}
  if(action==='ending'&&p.chapterComplete)change('CHAPTER_COMPLETE');
  break;
 case 'LEARNING':{
  const cards=stageCards[game.stage-1];
  if(action==='lesson-prev'&&game.page>0){game.page--;render();}
  if(action==='lesson-next'){
   Engine.teach(p,cards.slice(game.page*2,game.page*2+2).map(item=>item.id));save();
   if((game.page+1)*2>=cards.length)startBattle();else{game.page++;render();}
  }break;}
 case 'BATTLE_READY':if(action==='fight'){game.effect='';change('PLAYER_SELECT');}break;
 case 'PLAYER_SELECT':if(action==='ability')selectAbility(id);break;
 case 'QUESTION_ACTIVE':{
  const index=Number(id),choices=game.task.choices;
  if(action==='choice'&&game.task.question.type!=='order'&&Object.hasOwn(choices,index))submitAnswer(choices[index]);
  if(action==='word'&&game.task.question.type==='order'&&Object.hasOwn(choices,index)&&!game.order.includes(index)){game.order.push(index);render();}
  if(action==='undo'){game.order.pop();render();}
  if(action==='submit-order'&&game.task.question.type==='order'&&game.order.length===choices.length)submitAnswer(game.order.map(i=>choices[i]).join(' '));
  if(action==='replay')listen();
  if(action==='transcript'){game.speechFallback=true;render();}
  break;}
 case 'ANSWER_FEEDBACK':if(action==='resolve')resolveTurn();break;
 case 'VICTORY':if(action==='rewards'){change('REWARD');if(game.reward.levelUp)AudioFX.play('level',p.settings);}break;
 case 'REWARD':if(action==='onwards'){game.battle=null;change(game.stage===3?'CHAPTER_COMPLETE':'MAP');}break;
 case 'DEFEAT':if(action==='retry')startBattle();break;
 case 'REVIEW':
  if(action==='review-one'&&p.mistakes[id]){game.reviewId=id;game.reviewResult=false;render();}
  if(action==='reveal'){game.reviewResult=true;render();}
  if(action==='review-list'){game.reviewId='';render();}
  if(action==='review-back')change(game.reviewFrom);
  break;
 }
}
function handleClick(event){
 const el=event.target.closest('button[data-act]');
 if(!el||!el.isConnected||el.disabled||event.detail>1)return;
 if(game.screen==='PAUSED'&&!pauseDialog.contains(el))return;
 AudioFX.play('ui',game.profile.settings);dispatch(el.dataset.act,el.dataset.id);
}
app.tabIndex=-1;app.addEventListener('click',handleClick);pauseDialog.addEventListener('click',handleClick);
pauseDialog.setAttribute('aria-label','게임 설정');
pauseDialog.addEventListener('cancel',e=>{e.preventDefault();if(game.confirm==='reset'){game.confirm='';showSettings();}else closeSettings();});
pauseDialog.addEventListener('change',e=>{
 const setting=e.target.dataset.setting;
 if(['sound','volume','voice'].includes(setting)){
  game.profile.settings[setting]=setting==='volume'?Number(e.target.value)/100:e.target.checked;
  if(setting==='voice'&&!e.target.checked)AudioFX.stop();save();
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!e.repeat&&game.screen!=='PAUSED'){e.preventDefault();openSettings();}});
render();

</script></body></html>
